<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">
<head>
    <meta charset="UTF-8">
    <title>센서 상세 정보</title>
    <link rel="stylesheet" th:href="@{/css/status.css}">
</head>
<body>

<div layout:fragment="content">
    <div class="py-6">
        <div class="page-header d-print-none mb-4">
            <div class="row align-items-center">
            <div class="col">
                <h1 class="page-title">
                    <span class="org-prefix me-1" th:text="${sensor.organizationName + ' > ' + sensor.storageName + ' > ' + sensor.zoneName + ' >'}">조직이름 &gt; 저장소이름 &gt; 구역이름 &gt;</span>
                    <span th:text="${sensor.name}">센서 이름</span>
                </h1>
                <div class="text-secondary">구역에 연결된 센서 정보를 확인합니다.</div>
            </div>
            <div class="col-auto d-flex gap-2" th:if="${canManage}">
                <button type="button" onclick="openUpdateModal()" class="btn btn-outline-secondary">수정</button>
                <button type="button" th:onclick="'deleteZoneSensor(' + ${sensor.zoneId} + ', ' + ${sensor.zoneSensorId} + ')'" class="btn btn-outline-danger">삭제</button>
            </div>
        </div></div>

        <div class="page-content-panel">
            <div class="card mb-4">
                <div class="card-header plain-card-title">
                    <h2 class="card-title">센서 상세 정보</h2>
                </div>
                <div class="card-body p-0">
                    <div class="row g-0 border-bottom px-3 py-3">
                        <div class="col-sm-3 text-muted">센서 ID</div>
                        <div class="col-sm-9" th:text="${sensor.zoneSensorId}">1</div>
                    </div>
                    <div class="row g-0 border-bottom px-3 py-3">
                        <div class="col-sm-3 text-muted">센서 이름</div>
                        <div class="col-sm-9" th:text="${sensor.name}">센서 이름</div>
                    </div>
                    <div class="row g-0 border-bottom px-3 py-3">
                        <div class="col-sm-3 text-muted">Device EUI</div>
                        <div class="col-sm-9" th:text="${sensor.deviceEui}">00124B00...</div>
                    </div>
                    <div class="row g-0 px-3 py-3">
                        <div class="col-sm-3 text-muted">설명</div>
                        <div class="col-sm-9" th:text="${sensor.description()}">설명 내용</div>
                    </div>
                </div>
            </div>
            <a th:href="@{/storages/{storageId}/zones/{zoneId}(storageId=${sensor.storageId}, zoneId=${sensor.zoneId})}" class="btn btn-outline-secondary mt-2">← 구역 상세로 돌아가기</a>
        </div>
    </div>

    <div th:replace="~{fragments/modal/zone-sensor-detail-modal :: modal}"></div>
</div>

<th:block layout:fragment="script">
    <script th:src="@{/js/common/validation.js}"></script>
    <script th:src="@{/js/common/form.js}"></script>
    <script th:src="@{/js/zone/zone-sensor-detail.js}"></script>
</th:block>

</body>
</html>
