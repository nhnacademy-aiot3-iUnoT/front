<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title> iUnoT</title>
    <meta name="api-base" th:content="${@environment.getProperty('app.api-base-url')}">
    <script th:src="@{/js/api.js}"></script>

    <script>
        const savedTheme = localStorage.getItem("theme");

        if (savedTheme) {
            document.documentElement.setAttribute(
                "data-bs-theme",
                savedTheme
            );
        }
    </script>

    <link href="https://cdn.jsdelivr.net/npm/@tabler/core/dist/css/tabler.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>

<body>
<div class="theme-toggle">
    <button
            type="button"
            class="btn btn-icon btn-ghost-secondary rounded-circle"
            id="theme-toggle">

        <i class="ti ti-moon fs-2 moon-icon"></i>
        <i class="ti ti-sun fs-2 sun-icon"></i>

    </button>
</div>
<div layout:fragment="content"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/theme.js}"></script>
<th:block layout:fragment="script"></th:block>
</body>
</html>
