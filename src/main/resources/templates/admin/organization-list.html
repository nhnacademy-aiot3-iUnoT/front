<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin-layout}">>

<head>
    <meta charset="UTF-8">
    <title>조직 관리</title>
</head>

<body>
<div layout:fragment="content">

<div class="page">
    <div class="page-wrapper">
        <div class="container-xl">
            <div class="page-header d-print-none mt-3">
                <div class="row align-items-center">
                    <div class="col">
                        <h2 class="page-title">
                            조직 관리
                        </h2>

                        <div class="text-muted">
                            서비스에 가입된 조직을 관리합니다.
                        </div>
                    </div>

                    <div class="col-auto ms-auto">
                        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createOrganizationModal">
                            조직 생성
                        </button>
                    </div>
                </div>
            </div>
            <div th:replace="~{admin/fragments/organization-create-modal :: modal}"></div>

            <div class="card mt-3">
                <div class="card-body">
                    <div class="row g-2">
                        <div class="col-md-4">
                            <input type="text" class="form-control" placeholder="조직명 검색">
                        </div>

                        <div class="col-md-3">
                            <select class="form-select">
                                <option value="">전체</option>
                                <option th:each="status : ${searchTypes}"
                                        th:value="${status}"
                                        th:text="${status.getKo()}"></option>
                            </select>
                        </div>

                        <div class="col-auto">
                            <button class="btn btn-outline-primary">
                                검색
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mt-3">
                <div class="table-responsive">
                    <table class="table table-vcenter card-table">
                        <thead>
                        <tr>
                            <th>조직명</th>
                            <th>상태</th>
                            <th>생성일</th>
                            <th>관리</th>
                        </tr>

                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(organizations)}">
                            <td colspan="5"
                                class="text-center text-muted py-5">
                                등록된 조직이 없습니다.
                            </td>
                        </tr>

                        <tr th:each="organization : ${organizations.content}">
                            <input type="hidden" th:value="${organization.id}">
                            <td th:text="${organization.name}"></td>
                            <td>
                                <span class="badge bg-azure-lt"
                                      th:if="${organization.status.name() == 'PENDING'}">
                                    진행중
                                </span>

                                <span class="badge bg-green-lt"
                                      th:if="${organization.status.name() == 'ACTIVE'}">
                                    활성
                                </span>


                                <span class="badge bg-yellow-lt"
                                      th:if="${organization.status.name() == 'INACTIVE'}">
                                    비활성
                                </span>


                                <span class="badge bg-red-lt"
                                      th:if="${organization.status.name() == 'CLOSED'}">
                                    종료
                                </span>
                            </td>
                            <td th:text="${#temporals.format(organization.createdAt(), 'yyyy-MM-dd HH:mm')}"></td>
                            <td>
                                <button class="btn btn-sm btn-outline-secondary">
                                    상세
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
                </div>

                <div class="card-footer">
                    <ul class="pagination m-0 justify-content-end">
                        <li class="page-item"
                            th:classappend="${organizations.page == 0} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/admin/organizations(page=${organizations.page - 1})}">
                                이전
                            </a>
                        </li>

                        <li class="page-item"
                            th:each="num : ${#numbers.sequence(0, organizations.totalPages - 1)}"
                            th:classappend="${num == organizations.page} ? 'active'">

                            <a class="page-link"
                               th:href="@{/admin/organizations(page=${num})}"
                               th:text="${num + 1}">
                                1
                            </a>
                        </li>

                        <li class="page-item"
                            th:classappend="${organizations.last} ? 'disabled'">

                            <a class="page-link"
                               th:href="@{/admin/organizations(page=${organizations.page + 1})}">
                                다음
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
<script>
    document
        .getElementById("createBtn")
        .addEventListener("click", async () => {

            const request = {
                businessNumber:
                document.getElementById("businessNumber").value,

                name:
                document.getElementById("name").value,

                email:
                document.getElementById("email").value
            };


            const response = await fetch(
                "/admin/organizations",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":"application/json"
                    },
                    body:JSON.stringify(request)
                }
            );


            if(response.ok){
                location.reload();
            }

        });
</script>
</body>
</html>
