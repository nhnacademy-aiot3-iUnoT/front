<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin-layout}">

<head>
    <meta charset="UTF-8">
    <title>관리자 계정 생성</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>
<div layout:fragment="content">
    <div class="page-header d-print-none mt-3">
        <div class="row align-items-center">
            <div class="col">
                <div class="page-pretitle">회원 관리</div>
                <h2 class="page-title">관리자 계정 생성</h2>
            </div>
            <div class="col-auto ms-auto">
                <a class="btn btn-outline-secondary" th:href="@{/admin/users}">
                    <i class="ti ti-arrow-left me-1"></i>
                    목록으로
                </a>
            </div>
        </div>
    </div>

    <div class="row justify-content-center mt-4">
        <div class="col-xl-6 col-lg-8">
            <form class="card" th:action="@{/admin/users}" th:object="${createRequest}" method="post">
                <div class="card-header">
                    <h3 class="card-title">계정 정보</h3>
                </div>
                <div class="card-body">
                    <div class="alert alert-info">
                        <i class="ti ti-shield-lock me-1"></i>
                        생성된 계정은 즉시 <strong>ADMIN</strong> 권한을 가집니다.
                    </div>

                    <div class="mb-3">
                        <label class="form-label required" for="name">이름</label>
                        <input id="name" class="form-control" type="text" th:field="*{name}"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                               autocomplete="name" maxlength="100">
                        <div class="invalid-feedback" th:errors="*{name}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label required" for="email">이메일</label>
                        <input id="email" class="form-control" type="email" th:field="*{email}"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                               autocomplete="username" maxlength="254">
                        <div class="invalid-feedback" th:errors="*{email}"></div>
                    </div>

                    <div>
                        <label class="form-label required" for="password">임시 비밀번호</label>
                        <input id="password" class="form-control" type="password" th:field="*{password}"
                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                               autocomplete="new-password" minlength="6" maxlength="64">
                        <div class="invalid-feedback" th:errors="*{password}"></div>
                        <div class="form-hint">6자 이상 64자 이하로 입력해주세요.</div>
                    </div>
                </div>
                <div class="card-footer d-flex justify-content-end gap-2">
                    <a class="btn btn-link" th:href="@{/admin/users}">취소</a>
                    <button class="btn btn-primary" type="submit">
                        <i class="ti ti-user-plus me-1"></i>
                        관리자 생성
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
