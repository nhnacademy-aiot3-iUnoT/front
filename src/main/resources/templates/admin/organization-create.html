<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin-layout}">

<body>
<div layout:fragment="content">

    <div class="page">
        <div class="page-wrapper">
            <div class="container-xl">
                <div class="page-header d-print-none mt-3">
                    <div class="row align-items-center">
                        <div class="col">
                            <h2 class="page-title">
                                조직 생성
                            </h2>
                        </div>
                    </div>
                </div>

                <div class="card mt-3">
                    <div class="card-body">
                        <form th:action="@{/admin/organizations}" th:object="${orgCreateRequest}" method="post" id="orgCreateForm">
                            <div class="mb-3">
                                <label class="form-label">
                                    사업자번호
                                </label>

                                <input type="text" class="form-control" maxlength="10"
                                       th:field="*{businessNumber}" placeholder="숫자만 입력하세요" required>

                                <div class="invalid-feedback"></div>

                                <div class="text-danger"
                                     th:errors="*{businessNumber}">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">
                                    조직명
                                </label>

                                <input type="text" class="form-control" maxlength="50"
                                       th:field="*{name}" placeholder="조직명을 입력해주세요" required>

                                <div class="invalid-feedback"></div>

                                <div class="text-danger"
                                     th:errors="*{name}">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">
                                    Owner 이메일
                                </label>
                                <input type="email" class="form-control" maxlength="255"
                                       th:field="*{email}" placeholder="Owner의 이메일을 입력해주세요" required>

                                <div class="invalid-feedback"></div>

                                <div class="text-danger"
                                     th:errors="*{email}">
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/admin/organizations}"
                                   class="btn btn-secondary">
                                    취소
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    생성
                                </button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<th:block layout:fragment="script">

    <script th:src="@{/js/common/validation.js}"></script>
    <script th:src="@{/js/common/form.js}"></script>

    <script th:src="@{/js/admin/organization-create.js}"></script>

</th:block>
</body>
</html>
