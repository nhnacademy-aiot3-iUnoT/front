<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin-layout}">

<head>
    <meta charset="UTF-8">
    <title>조직 상세</title>
</head>

<body>

<div layout:fragment="content">
    <div class="page">
        <div class="page-wrapper">
            <div class="container-xl">
                <div class="page-header mt-3">
                    <div class="row align-items-center">
                        <div class="col">
                            <h2 class="page-title">
                                조직 상세
                            </h2>

                            <div class="text-muted">
                                조직 정보를 확인합니다.
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card mt-3">
                    <div class="card-header">
                        <h3 class="card-title">
                            기본 정보
                        </h3>
                    </div>

                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col-md-3 text-muted">
                                조직명
                            </div>

                            <div class="col-md-9"
                                 th:text="${organization.name}">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-3 text-muted">
                                사업자번호
                            </div>

                            <div class="col-md-9"
                                 th:text="${organization.businessNumber}">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-3 text-muted">
                                상태
                            </div>

                            <div class="col-md-9">
                                <span class="badge bg-azure-lt"
                                      th:if="${organization.status.name() == 'PENDING'}">
                                    진행중
                                </span>

                                <span class="badge bg-green-lt"
                                      th:if="${organization.status.name() == 'ACTIVE'}">
                                    활성
                                </span>

                                <span class="badge bg-yellow-lt"
                                      th:if="${organization.status.name() == 'INACTIVE'}">
                                    비활성
                                </span>

                                <span class="badge bg-red-lt"
                                      th:if="${organization.status.name() == 'SUSPENDED'}">
                                    종료
                                </span>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-3 text-muted">
                                생성일
                            </div>

                            <div class="col-md-9"
                                 th:text="${#temporals.format(organization.createdAt, 'yyyy-MM-dd HH:mm')}">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card mt-3">
                    <div class="card-header">
                        <h3 class="card-title">
                            주소 정보
                        </h3>
                    </div>

                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col-md-3 text-muted">
                                우편번호
                            </div>

                            <div class="col-md-9"
                                 th:text="${organization.zipCode}">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-3 text-muted">
                                도로명 주소
                            </div>

                            <div class="col-md-9"
                                 th:text="${organization.roadAddress}">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-3 text-muted">
                                상세 주소
                            </div>
                            <div class="col-md-9"
                                 th:text="${organization.addressDetail}">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-3 d-flex justify-content-end gap-2">
                    <a th:href="@{/admin/organizations}"
                       class="btn btn-secondary">
                        목록
                    </a>

                    <form th:action="@{/admin/organizations/{id}(id=${organization.id})}" th:method="delete" class="m-0">
                        <button type="submit" class="btn btn-danger">
                            삭제
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
