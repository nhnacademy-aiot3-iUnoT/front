<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin-layout}">

<head>
    <meta charset="UTF-8">
    <title>회원 상세</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/status.css}">
</head>

<body>
<div layout:fragment="content">
    <div class="page-header d-print-none mt-3">
        <div class="row align-items-center g-3">
            <div class="col">
                <div class="page-pretitle">회원 관리</div>
                <h2 class="page-title" th:text="${user.name != null ? user.name : '탈퇴 회원'}">회원 상세</h2>
            </div>
            <div class="col-auto ms-auto">
                <a class="btn btn-outline-secondary" th:href="@{/admin/users}">
                    <i class="ti ti-arrow-left me-1"></i>
                    목록으로
                </a>
            </div>
        </div>
    </div>

    <div class="alert alert-success mt-4" role="alert" th:if="${successMessage}">
        <i class="ti ti-circle-check me-1"></i>
        <span th:text="${successMessage}"></span>
    </div>

    <div class="card mt-4">
        <div class="card-body">
            <div class="row g-4 align-items-center">
                <div class="col-auto">
                    <span class="avatar avatar-xl user-avatar"
                          th:text="${user.name != null and !user.name.isBlank() ? #strings.substring(user.name, 0, 1) : '?'}">?</span>
                </div>
                <div class="col">
                    <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
                        <h3 class="mb-0" th:text="${user.name != null ? user.name : '탈퇴 회원'}"></h3>
                        <span class="badge role-badge"
                              th:classappend="${user.accountRole.name() == 'ADMIN'} ? ' role-admin' : ' role-user'"
                              th:text="${user.accountRole.name() == 'ADMIN' ? '관리자' : '일반 회원'}"></span>
                        <span class="badge status-badge"
                              th:classappend="' status-' + ${user.accountStatus.name().toLowerCase()}"
                              th:text="${user.accountStatus.ko}"></span>
                    </div>
                    <div class="text-secondary" th:text="${user.email != null ? user.email : '-'}"></div>
                    <div class="text-secondary small mt-2">
                        UUID: <code th:text="${user.uuid}"></code>
                    </div>
                </div>
                <div class="col-md-auto text-secondary small">
                    <div>가입: <span th:text="${user.createdAt != null ? #temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm') : '-'}"></span></div>
                    <div>수정: <span th:text="${user.updatedAt != null ? #temporals.format(user.updatedAt, 'yyyy-MM-dd HH:mm') : '-'}"></span></div>
                </div>
            </div>
        </div>
    </div>

    <div class="alert alert-warning mt-4" th:if="${user.accountRole.name() == 'ADMIN'}">
        <i class="ti ti-alert-triangle me-1"></i>
        관리자 계정의 비밀번호나 상태를 변경하면 해당 관리자의 접근에 영향을 줄 수 있습니다.
    </div>

    <div class="alert alert-secondary mt-4" th:if="${user.accountStatus.name() == 'WITHDRAWN'}">
        탈퇴한 계정은 정보를 수정하거나 재활성화할 수 없습니다.
    </div>

    <div class="row row-cards mt-1" th:unless="${user.accountStatus.name() == 'WITHDRAWN'}">
        <div class="col-lg-6">
            <form class="card h-100"
                  id="adminUserNameForm"
                  th:action="@{/admin/users/{uuid}/name(uuid=${user.uuid})}"
                  th:object="${nameRequest}"
                  method="post">
                <input type="hidden" name="_method" value="put">
                <div class="card-header">
                    <h3 class="card-title">이름 수정</h3>
                </div>
                <div class="card-body" data-account-validation-field>
                    <label class="form-label required" for="name">이름</label>
                    <input id="name" class="form-control" type="text" th:field="*{name}"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                           maxlength="100" required>
                    <div class="invalid-feedback" th:errors="*{name}"></div>
                </div>
                <div class="card-footer text-end">
                    <button class="btn btn-primary" type="submit">이름 저장</button>
                </div>
            </form>
        </div>

        <div class="col-lg-6">
            <form class="card h-100"
                  id="adminUserPasswordForm"
                  th:action="@{/admin/users/{uuid}/password(uuid=${user.uuid})}"
                  th:object="${passwordRequest}"
                  method="post">
                <input type="hidden" name="_method" value="put">
                <div class="card-header">
                    <h3 class="card-title">비밀번호 재설정</h3>
                </div>
                <div class="card-body" data-account-validation-field>
                    <label class="form-label required" for="password">새 비밀번호</label>
                    <input id="password" class="form-control" type="password" th:field="*{password}"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                           autocomplete="new-password" minlength="6" maxlength="64" required>
                    <div class="invalid-feedback" th:errors="*{password}"></div>
                    <div class="form-hint">6자 이상 64자 이하로 입력해주세요.</div>
                </div>
                <div class="card-footer text-end">
                    <button class="btn btn-outline-primary" type="submit">비밀번호 재설정</button>
                </div>
            </form>
        </div>

        <div class="col-12">
            <form class="card"
                  id="adminUserStatusForm"
                  th:action="@{/admin/users/{uuid}/status(uuid=${user.uuid})}"
                  th:object="${statusRequest}"
                  method="post">
                <input type="hidden" name="_method" value="put">
                <div class="card-header">
                    <h3 class="card-title">계정 상태 변경</h3>
                </div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-4" data-account-validation-field>
                            <label class="form-label required" for="action">변경 작업</label>
                            <select id="action" class="form-select" th:field="*{action}" required
                                    th:classappend="${#fields.hasErrors('action')} ? 'is-invalid'">
                                <option value="">작업 선택</option>
                                <option th:each="statusAction : ${statusActions}"
                                        th:value="${statusAction}"
                                        th:text="${statusAction.ko}"></option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{action}"></div>
                        </div>
                        <div class="col-md-8" data-account-validation-field>
                            <label class="form-label required" for="reason">변경 사유</label>
                            <input id="reason" class="form-control" type="text" th:field="*{reason}"
                                   th:classappend="${#fields.hasErrors('reason')} ? 'is-invalid'"
                                   placeholder="감사 로그에 남길 사유" maxlength="200" required>
                            <div class="invalid-feedback" th:errors="*{reason}"></div>
                        </div>
                    </div>
                </div>
                <div class="card-footer text-end">
                    <button class="btn btn-outline-danger" type="submit">상태 변경</button>
                </div>
            </form>
        </div>
    </div>
</div>
<th:block layout:fragment="script">
    <script th:src="@{/js/admin/user-validation.js}"></script>
</th:block>
</body>
</html>
