<div th:fragment="modal" class="modal modal-blur fade" id="create-modal" tabindex="-1" aria-hidden="true" th:if="${canManage}">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h3 class="modal-title">저장소 추가</h3>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
            </div>

            <div class="modal-body">
                <div class="mb-3">
                    <label for="new-name" class="form-label required">이름</label>
                    <input id="new-name" class="form-control" type="text" placeholder="저장소 이름을 입력하세요" maxlength="50" required>
                    <div class="invalid-feedback"></div>

                </div>

                <div class="mb-3">
                    <label for="new-description" class="form-label">설명</label>
                    <textarea id="new-description" class="form-control" placeholder="저장소 설명을 입력하세요" maxlength="255"></textarea>
                    <div class="invalid-feedback"></div>
                    <div class="d-flex justify-content-end mt-1">
                        <small class="text-muted">
                            최대 255자
                        </small>
                    </div>
                </div>

                <label class="form-label">부서</label>
                <div id="department-checkbox-container" class="department-scroll-box">
                    <span class="text-secondary small">부서 목록을 불러오는 중...</span>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">취소</button>
                <button type="button" class="btn btn-primary" onclick="createStorage()">추가</button>
            </div>

        </div>
    </div>
</div>
