<th:block th:fragment="modal" th:if="${canManage}">
    <div id="edit-zone-modal" class="modal modal-blur fade" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">구역 정보 수정</h3>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label for="edit-zone-name" class="form-label required">이름</label>
                    <input id="edit-zone-name" class="form-control" type="text" placeholder="구역 이름을 입력하세요" th:value="${zone.name}" maxlength="30">
                    <div class="invalid-feedback"></div>
                </div>
                <div class="mb-3">
                    <label for="edit-zone-description" class="form-label">설명</label>
                    <textarea id="edit-zone-description" class="form-control" maxlength="255" placeholder="구역 설명을 입력하세요" th:text="${zone.description}"></textarea>
                    <div class="invalid-feedback"></div>
                    <div class="d-flex justify-content-end mt-1">
                        <small class="text-muted">
                            최대 255자
                        </small>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">취소</button>
                <button type="button" id="btn-save-zone" class="btn btn-primary" th:attr="data-storage-id=${zone.storageId}, data-zone-id=${zone.zoneId}" onclick="onUpdateZoneInfoClick(this)">저장</button>
            </div>
        </div></div>
    </div>

    <div id="sensor-modal" class="modal modal-blur fade" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title">구역 센서 추가</h3>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="sensor-eui" class="form-label required">Device EUI</label>
                        <input id="sensor-eui" class="form-control" type="text" placeholder="예: EUI-12345678" maxlength="50">
                        <div class="invalid-feedback"></div>
                        <div class="d-flex justify-content-end mt-1">
                            <small class="text-muted">
                                최대 50자
                            </small>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="sensor-name" class="form-label required">센서 이름</label>
                        <input id="sensor-name" class="form-control" type="text" placeholder="센서 이름을 입력하세요" maxlength="50">
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="mb-3">
                        <label for="sensor-description" class="form-label">설명</label>
                        <textarea id="sensor-description" class="form-control" placeholder="센서 설명을 입력하세요" maxlength="255"></textarea>
                        <div class="invalid-feedback"></div>
                        <div class="d-flex justify-content-end mt-1">
                            <small class="text-muted">
                                최대 255자
                            </small>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="button" id="btn-create-sensor" class="btn btn-primary" th:attr="data-zone-id=${zone.zoneId}" onclick="onCreateZoneSensorClick(this)">추가</button>
                </div>
            </div>
        </div>
    </div>

    <div id="threshold-modal" class="modal modal-blur fade" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title">구역 임계값 설정</h3>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="modal-zone-id" th:value="${zone.zoneId}">
                    <div class="mb-3">
                        <label for="threshold-sensor-type" class="form-label">센서 타입</label>
                        <select id="threshold-sensor-type" class="form-select" onchange="onThresholdSensorTypeChange()"></select>
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="mb-3">
                        <label for="threshold-min-value" class="form-label">최소값</label>
                        <input id="threshold-min-value" class="form-control" type="number" step="0.1" placeholder="예: 10">
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="mb-3">
                        <label for="threshold-max-value" class="form-label">최대값</label>
                        <input id="threshold-max-value" class="form-control" type="number" step="0.1" placeholder="예: 30">
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="mb-3">
                        <label for="threshold-delay" class="form-label">임계 시간 (분)</label>
                        <input id="threshold-delay" class="form-control" type="number" placeholder="예: 5" value="5">
                        <div class="invalid-feedback"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="button" id="btn-create-threshold" class="btn btn-primary">저장</button>
                </div>
            </div>
        </div>
    </div>
</th:block>
