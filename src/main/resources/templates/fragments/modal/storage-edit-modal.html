<div th:fragment="modal" class="modal modal-blur fade" id="edit-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">저장소 수정</h3>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                <label for="edit-name" class="form-label required">이름</label>
                <input id="edit-name" class="form-control" type="text" th:value="${storage.name}"
                       th:attr="data-initial-value=${storage.name}"
                       maxlength="50" placeholder="저장소 이름을 입력해주세요">
                    <div class="invalid-feedback"></div>
                </div>

                <div class="mb-3">
                    <label for="edit-description" class="form-label">설명</label>
                    <textarea id="edit-description" class="form-control" maxlength="255"
                              th:attr="data-initial-value=${storage.description}"
                              placeholder="저장소 설명을 입력해주세요." th:text="${storage.description}"></textarea>
                    <div class="invalid-feedback"></div>
                    <div class="d-flex justify-content-between mt-2">
                        <div class="form-hint"></div>
                        <small class="text-muted">
                            최대 255자
                        </small>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">취소</button>
                <button type="button" class="btn btn-primary" th:attr="onclick=|updateStorage('${storage.storageId}')|">저장</button>
        </div>
    </div>
</div>
</div>
