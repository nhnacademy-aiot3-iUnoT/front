<div th:fragment="modal" class="modal modal-blur fade" id="zone-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">구역 추가</h3>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                <label for="zone-name" class="form-label required">구역 이름</label>
                <input id="zone-name" class="form-control" type="text" placeholder="구역 이름을 입력하세요" maxlength="30">
                <div class="invalid-feedback"></div>
            </div>
            <div class="mb-3">
                <label for="zone-description" class="form-label">구역 설명</label>
                <textarea id="zone-description" class="form-control" placeholder="구역 설명을 입력하세요" maxlength="255"></textarea>
                <div class="invalid-feedback"></div>
                <div class="d-flex justify-content-between mt-2">
                    <div class="form-hint"></div>
                    <small class="text-muted">
                        최대 255자
                    </small>
                </div>
            </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">취소</button>
                <button type="button" class="btn btn-primary" th:attr="onclick=|createZone('${storage.storageId}')|">추가</button>
            </div>
        </div>
    </div>
</div>
