<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">
<head>
    <meta charset="UTF-8">
    <title>환경 검토 내역 조회</title>
    <link rel="stylesheet" th:href="@{/css/review-history.css}">
</head>
<body>

<div layout:fragment="content">
    <div class="container" style="max-width: 1200px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
        <h2>📋 환경 검토 내역 조회</h2>

        <!-- 상단 필터 및 저장소 선택 영역 -->
        <div class="filter-section" style="margin: 20px 0; display: flex; gap: 10px; align-items: center;">
            <label for="storageSelect"><strong>저장소 선택:</strong></label>
            <select id="storageSelect" style="padding: 8px; border-radius: 4px; border: 1px solid #ccc; min-width: 200px;">
                <option value="">내 부서에 포함된 전체 저장소</option>
            </select>
            <button type="button" id="searchBtn" class="btn-primary">조회</button>
        </div>

        <!-- 검토 내역 목록 테이블 -->
        <div class="table-container" style="overflow-x: auto;">
            <table>
                <thead>
                <tr>
                    <th>제품명</th>
                    <th>포장단위</th>
                    <th>처리 유형</th>
                    <th>검토 일시</th>
                    <th>검토자 ID</th>
                    <th>상세보기</th>
                </tr>
                </thead>
                <tbody id="historyTableBody">
                <tr>
                    <td colspan="6" style="text-align: center; color: #888; padding: 20px;">데이터를 불러오는 중입니다...</td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- 페이징 영역 -->
        <div class="pagination" id="pagination" style="display: flex; justify-content: center; gap: 5px; margin-top: 20px;"></div>
    </div>
</div>

<th:block layout:fragment="script">
    <script th:src="@{/js/review/review-history.js}"></script>
</th:block>

</body>
</html>
