<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">
<head>
    <meta charset="UTF-8">
    <title>환경 검토 상세 정보</title>
    <link rel="stylesheet" th:href="@{/css/review-detail.css}">
</head>
<body>

<div layout:fragment="content">
    <div class="container">

        <!-- 상단 타이틀 및 목록으로 버튼 -->
        <div class="page-header">
            <h2>🔍 환경 검토 상세 정보</h2>
            <button type="button" class="btn-secondary" onclick="history.back()">목록으로</button>
        </div>

        <!-- 1. 기본 검토 정보 -->
        <div class="info-box">
            <h3 class="section-title">📌 기본 정보</h3>
            <div class="info-grid">
                <div><strong>제품명:</strong> <span th:text="${reviewDetail.productName}">제품명</span></div>
                <div><strong>포장단위:</strong> <span th:text="${reviewDetail.packUnit}">포장단위</span></div>
                <div><strong>LOT 번호:</strong> <span th:text="${reviewDetail.lotNumber}">LOT</span></div>
                <div><strong>조직 / 저장소 / 구역:</strong> <span th:text="${reviewDetail.organizationName} + ' / ' + ${reviewDetail.storageName} + ' / ' + ${reviewDetail.zoneName}">위치</span></div>
                <div><strong>검토 당시 수량:</strong> <span th:text="${reviewDetail.quantityAtReview}">0</span></div>
                <div><strong>처분 유형:</strong>
                    <span th:if="${reviewDetail.isOut}" style="color: #d9534f; font-weight: bold;">폐기 처리</span>
                    <span th:unless="${reviewDetail.isOut}" style="color: #5cb85c; font-weight: bold;">정상 처리</span>
                </div>
                <div><strong>검토 일시:</strong> <span th:text="${#temporals.format(reviewDetail.createdAt, 'yyyy-MM-dd HH:mm:ss')}">일시</span></div>
                <div><strong>검토자 ID:</strong> <span th:text="${reviewDetail.reviewerId}">UUID</span></div>
            </div>
            <div class="memo-area">
                <strong>검토 메모:</strong>
                <p class="memo-box" th:text="${reviewDetail.memo != null ? reviewDetail.memo : '작성된 메모가 없습니다.'}"></p>
            </div>
        </div>

        <!-- 2. 당시 발생했던 환경 이벤트 목록 -->
        <div class="section-group">
            <h3 class="sub-section-title">⚡ 당시 감지된 환경 이벤트</h3>
            <div class="table-container">
                <table>
                    <thead>
                    <tr>
                        <th>이벤트 타입</th>
                        <th>위반 유형</th>
                        <th>측정값</th>
                        <th>기준값</th>
                        <th>발생 일시</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(reviewDetail.environmentEvents)}">
                        <td colspan="5" style="text-align: center; color: #888; padding: 20px;">관련 환경 이벤트가 없습니다.</td>
                    </tr>
                    <tr th:each="event : ${reviewDetail.environmentEvents}">
                        <td th:text="${event.environmentType}">TYPE</td>
                        <td th:text="${event.breachType}">BREACH</td>
                        <td th:text="${event.detectedValue}">0</td>
                        <td th:text="${event.thresholdValue}">0</td>
                        <td th:text="${#temporals.format(event.createdAt, 'yyyy-MM-dd HH:mm:ss')}">일시</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 3. 해당 재고의 이전 검토 이력 목록 -->
        <div class="section-group">
            <h3 class="sub-section-title">📜 해당 재고 이전 검토 이력</h3>
            <div class="table-container">
                <table>
                    <thead>
                    <tr>
                        <th>제품명</th>
                        <th>포장단위</th>
                        <th>처리 유형</th>
                        <th>검토 일시</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(reviewDetail.inventoryReviewHistories)}">
                        <td colspan="4" style="text-align: center; color: #888; padding: 20px;">이전 검토 이력이 없습니다.</td>
                    </tr>
                    <tr th:each="hist : ${reviewDetail.inventoryReviewHistories}">
                        <td th:text="${hist.productName}">제품명</td>
                        <td th:text="${hist.packUnit}">단위</td>
                        <td>
                            <span th:if="${hist.isOut}" style="color: #d9534f; font-weight: bold;">폐기</span>
                            <span th:unless="${hist.isOut}" style="color: #5cb85c; font-weight: bold;">정상</span>
                        </td>
                        <td th:text="${#temporals.format(hist.createdAt, 'yyyy-MM-dd HH:mm:ss')}">일시</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<th:block layout:fragment="script">
</th:block>

</body>
</html>
