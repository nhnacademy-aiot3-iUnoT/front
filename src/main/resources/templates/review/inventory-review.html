<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">
<head>
    <meta charset="UTF-8">
    <title>환경 검토 대상 재고 관리</title>
</head>
<body>

<div layout:fragment="content">
    <main class="py-6">
        <div class="page-header d-print-none mb-4">
            <div class="row align-items-center">
                <div class="col">
                    <h2 class="page-title">환경 검토 대상 재고 관리</h2>
                    <div class="text-muted mt-1">
                        환경 이상 발생 이후 검토가 필요한 재고를 관리합니다.
                    </div>
                </div>

                <div class="col-auto d-flex gap-2">
                    <a class="btn btn-outline-secondary"
                       th:href="@{/inventories}">
                        <i class="ti ti-arrow-left me-1"></i>
                        전체 재고 목록으로
                    </a>

                    <a class="btn btn-primary"
                       th:href="@{/environment-reviews}">
                        검토 내역 조회
                    </a>
                </div>
            </div>
        </div>

        <section class="card mt-5">
            <div class="card-body border-bottom py-3">
                <div class="row g-2 align-items-end">
                    <div class="col-md-6">
                        <label for="storageSelect" class="form-label">저장소</label>
                        <select id="storageSelect" class="form-select">
                            <option value="">내 부서에 포함된 전체 저장소</option>
                        </select>
                    </div>

                    <div class="col-auto">
                        <button type="button" id="searchBtn" class="btn btn-primary">
                            조회
                        </button>
                    </div>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-vcenter table-hover card-table">
                    <thead>
                    <tr>
                        <th>제품명</th>
                        <th>포장단위</th>
                        <th>LOT 번호</th>
                        <th>유통기한</th>
                        <th>수량</th>
                        <th>저장소 / 구역</th>
                        <th>마지막 검토일</th>
                        <th>관리</th>
                    </tr>
                    </thead>
                    <tbody id="inventoryTableBody">
                    <tr>
                        <td colspan="8" class="text-center text-muted py-5">
                            데이터를 불러오는 중입니다...
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div id="pagination"
                 class="card-footer d-flex justify-content-center gap-2">
            </div>
        </section>

        <div class="modal modal-blur fade"
             id="eventModal"
             tabindex="-1"
             aria-labelledby="eventModalTitle"
             aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3 class="modal-title" id="eventModalTitle">
                            재고 환경 이벤트 검토
                        </h3>

                        <button type="button"
                                class="btn-close"
                                data-bs-dismiss="modal"
                                aria-label="닫기">
                        </button>
                    </div>

                    <div class="modal-body">
                        <p class="text-muted mb-3">
                            마지막 검토일 이후 발생한 환경 이상 내역입니다.
                        </p>

                        <div class="table-responsive border rounded mb-4">
                            <table class="table table-sm table-vcenter mb-0">
                                <thead>
                                <tr>
                                    <th>이벤트 타입</th>
                                    <th>위반 유형</th>
                                    <th>측정값</th>
                                    <th>기준값</th>
                                    <th>발생 일시</th>
                                </tr>
                                </thead>
                                <tbody id="eventTableBody"></tbody>
                            </table>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">처리 유형</label>

                            <div class="form-selectgroup">
                                <label class="form-selectgroup-item">
                                    <input type="radio"
                                           name="isOut"
                                           value="false"
                                           class="form-selectgroup-input"
                                           checked>
                                    <span class="form-selectgroup-label">정상 처리</span>
                                </label>

                                <label class="form-selectgroup-item">
                                    <input type="radio"
                                           name="isOut"
                                           value="true"
                                           class="form-selectgroup-input">
                                    <span class="form-selectgroup-label">폐기 처리</span>
                                </label>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="memoInput" class="form-label">메모</label>
                            <textarea id="memoInput"
                                      class="form-control"
                                      rows="3"
                                      maxlength="255"
                                      placeholder="검토 의견을 입력하세요"></textarea>
                            <div class="form-hint">선택 입력 · 최대 255자</div>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button"
                                class="btn btn-outline-secondary"
                                data-bs-dismiss="modal">
                            취소
                        </button>

                        <button type="button"
                                id="submitReviewBtn"
                                class="btn btn-primary">
                            검토 완료 처리
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<th:block layout:fragment="script">
    <script th:src="@{/js/review/inventory-review.js}"></script>
</th:block>

</body>
</html>
