<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">
<head>
    <meta charset="UTF-8">
    <title>환경 검토 대상 재고 관리</title>
    <link rel="stylesheet" th:href="@{/css/inventory-review.css}">
</head>
<body>

<div layout:fragment="content">
    <div class="container">

        <!-- 타이틀 및 내역 페이지 이동 버튼 영역 -->
        <div class="page-header">
            <h2>📦 환경 검토 대상 재고 관리</h2>
            <button type="button" class="btn-secondary" onclick="location.href='/environment-reviews'">
                📋 검토 내역 조회
            </button>
        </div>

        <!-- 상단 필터 및 저장소 선택 영역 -->
        <div class="filter-section">
            <label for="storageSelect">저장소 선택:</label>
            <select id="storageSelect">
                <option value="">내 부서에 포함된 전체 저장소</option>
            </select>
            <button type="button" id="searchBtn" class="btn-primary">조회</button>
        </div>

        <!-- 재고 목록 테이블 -->
        <div class="table-container">
            <table>
                <thead>
                <tr>
                    <th>제품명</th>
                    <th>포장단위</th>
                    <th>LOT 번호</th>
                    <th>유통기한</th>
                    <th>수량</th>
                    <th>저장소 / 구역</th>
                    <th>마지막 검토일</th>
                    <th>관리</th>
                </tr>
                </thead>
                <tbody id="inventoryTableBody">
                <tr>
                    <td colspan="8" class="empty-data">데이터를 불러오는 중입니다...</td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- 페이징 영역 -->
        <div class="pagination" id="pagination"></div>
    </div>

    <!-- ================= 모달 영역 ================= -->
    <div id="eventModal" class="modal-wrapper" style="display: none;">
        <div class="modal-backdrop" onclick="closeEventModal()"></div>
        <div class="modal-box">
            <div class="modal-header">
                <h3>🚨 재고 환경 이벤트 검토</h3>
                <span class="close" onclick="closeEventModal()">&times;</span>
            </div>
            <p class="modal-desc">마지막 검토일 이후 발생한 환경 이상 내역입니다.</p>

            <div class="event-table-container">
                <table>
                    <thead>
                    <tr>
                        <th>이벤트 타입</th>
                        <th>위반 유형</th>
                        <th>측정값</th>
                        <th>기준값</th>
                        <th>발생 일시</th>
                    </tr>
                    </thead>
                    <tbody id="eventTableBody">
                    <!-- 동적 바인딩 -->
                    </tbody>
                </table>
            </div>

            <div class="review-form">
                <div class="form-group-radio">
                    <label class="form-label">처리 유형:</label>
                    <div class="radio-group">
                        <label><input type="radio" name="isOut" value="false" checked> 정상 처리</label>
                        <label><input type="radio" name="isOut" value="true"> 폐기 처리</label>
                    </div>
                </div>
                <div class="form-group-memo">
                    <label for="memoInput" class="form-label">메모 (선택, 최대 255자):</label>
                    <textarea id="memoInput" maxlength="255" placeholder="검토 의견을 입력하세요"></textarea>
                </div>
                <button type="button" id="submitReviewBtn" class="btn-primary btn-full">검토 완료 처리</button>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="script">
    <script th:src="@{/js/review/inventory-review.js}"></script>
</th:block>

</body>
</html>
