<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">
<head>
    <meta charset="UTF-8">
    <title>알림 센터</title>
    <link rel="stylesheet" th:href="@{/css/alert-list.css}">
</head>
<body>

<div layout:fragment="content">
    <div class="table-container">
        <!-- 상단 타이틀 및 전체 삭제 버튼 -->
        <div class="header-flex" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>🔔 알림 센터</h2>
            <button type="button" class="btn-danger" th:if="${canManage}" onclick="deleteAllAlerts()">전체 삭제</button>
        </div>

        <!-- 🔍 검색 및 필터 컨트롤 영역 -->
        <div class="filter-box" style="display: flex; gap: 15px; align-items: center; margin-bottom: 20px; background: #f8fafc; padding: 15px; border-radius: 8px;">
            <div>
                <label for="filter-alert-type" style="font-weight: bold; margin-right: 5px;">알림 타입:</label>
                <select id="filter-alert-type" onchange="loadAlerts(0)" style="padding: 6px; border-radius: 4px; border: 1px solid #cbd5e1;">
                    <option value="">전체 타입</option>
                    <option value="LOW_STOCK">재고 부족 (LOW_STOCK)</option>
                    <option value="ENV_WARNING">환경 경고 (ENV_WARNING)</option>
                    <option value="EXPIRING">유통기한 임박 (EXPIRING)</option>
                </select>
            </div>

            <div>
                <label for="filter-is-checked" style="font-weight: bold; margin-right: 5px;">읽음 여부:</label>
                <select id="filter-is-checked" onchange="loadAlerts(0)" style="padding: 6px; border-radius: 4px; border: 1px solid #cbd5e1;">
                    <option value="false" selected>안 읽은 알림만</option>
                    <option value="true">읽은 알림만</option>
                    <option value="">전체 보기</option>
                </select>
            </div>

            <div style="margin-left: auto;">
                <button type="button" class="btn-primary" onclick="markSelectedAsChecked()">선택 읽음 처리</button>
                <button type="button" class="btn-danger" th:if="${canManage}" onclick="deleteSelectedAlerts()" style="margin-left: 5px;">선택 삭제</button>
            </div>
        </div>

        <!-- 알림 리스트 테이블 -->
        <table>
            <thead>
            <tr>
                <th style="width: 40px; text-align: center;"><input type="checkbox" id="select-all" onclick="toggleSelectAll(this)"></th>
                <th style="width: 120px;">조직 이름</th>
                <th style="width: 130px;">타입</th>
                <th>메시지 내용</th>
                <th style="width: 150px; text-align: center;">발생 일시</th>
                <th style="width: 90px; text-align: center;">상태</th>
            </tr>
            </thead>
            <tbody id="alert-table-body">
            <tr>
                <td colspan="6" style="text-align: center; color: #888; padding: 30px;">알림을 불러오는 중입니다...</td>
            </tr>
            </tbody>
        </table>

        <!-- 📄 페이지네이션 영역 추가 -->
        <div id="pagination" class="pagination-container" style="display: flex; justify-content: center; gap: 5px; margin-top: 20px;">
            <!-- JS로 동적 생성 -->
        </div>
    </div>
</div>

<th:block layout:fragment="script">
    <script th:src="@{/js/alert/list.js}"></script>
</th:block>

</body>
</html>
