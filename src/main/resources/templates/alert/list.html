<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">
<head>
    <meta charset="UTF-8">
    <title>알림 센터</title>
    <link rel="stylesheet" th:href="@{/css/status.css}">
</head>
<body>

<div layout:fragment="content">
    <div class="py-6">
        <div class="page-header d-print-none mb-4"><div class="row align-items-center">
            <div class="col d-flex align-items-center gap-3">
                <h1 class="page-title">알림 센터</h1>
            </div>
            <div class="col-auto">
                <a th:href="@{/expiring}" class="btn btn-outline-secondary">
                    <i class="ti ti-hourglass-high"></i>임박 재고 조회</a>
                <button type="button" class="btn btn-outline-danger" th:if="${canManage}" onclick="deleteAllAlerts()">전체 삭제</button>
            </div>
        </div></div>

        <div class="page-content-panel">
        <div class="card mb-4">
            <div class="card-body">
                <div class="row g-2 align-items-end">
            <div class="col-md-4">
                <label for="filter-alert-type" class="form-label">알림 타입</label>
                <select id="filter-alert-type" class="form-select" onchange="loadAlerts(0)">
                    <option value="">전체 타입</option>
                    <option value="LOW_STOCK">재고 부족 (LOW_STOCK)</option>
                    <option value="ENV_WARNING">환경 경고 (ENV_WARNING)</option>
                    <option value="EXPIRING">유통기한 임박 (EXPIRING)</option>
                </select>
            </div>
            <div class="col-md-4">
                <label for="filter-is-checked" class="form-label">읽음 여부</label>
                <select id="filter-is-checked" class="form-select" onchange="loadAlerts(0)">
                    <option value="false" selected>안 읽은 알림만</option>
                    <option value="true">읽은 알림만</option>
                    <option value="">전체 보기</option>
                </select>
            </div>
            <div class="col-md-4 d-flex justify-content-md-end gap-2">
                <button type="button" class="btn btn-primary" onclick="markSelectedAsChecked()">선택 읽음 처리</button>
                <button type="button" class="btn btn-outline-warning" th:if="${canManage}" onclick="deleteSelectedAlerts()">선택 삭제</button>
            </div>
                </div>
            </div>
        </div>

        <div class="card"><div class="table-responsive"><table class="table table-vcenter table-hover card-table">
            <thead>
            <tr>
                <th class="text-center">
                    <input type="checkbox" id="select-all" onclick="toggleSelectAll(this)">
                </th>
                <th style="width: 120px;">조직 이름</th>
                <th style="width: 130px;">타입</th>
                <th>메시지 내용</th>
                <th class="text-center">발생 일시</th>
                <th class="text-center">상태</th>
            </tr>
            </thead>
            <tbody id="alert-table-body">
            <tr>
                <td colspan="6" style="text-align: center; color: #888; padding: 30px;">알림을 불러오는 중입니다...</td>
            </tr>
            </tbody>
        </table></div></div>

        <ul id="pagination" class="pagination m-0 justify-content-center">
        </ul></div>
    </div>
</div>

<th:block layout:fragment="script">
    <script th:src="@{/js/alert/list.js}"></script>
</th:block>

</body>
</html>
