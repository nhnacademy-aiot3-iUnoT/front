<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/auth-layout}">

<head>
    <title>비밀번호 찾기</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<div layout:fragment="content">
    <div class="container vh-100 d-flex align-items-center justify-content-center">
        <div class="card border-0 login-card">
            <div class="card-body p-0">
                <div class="row g-0 align-items-center">
                    <div class="col-lg-5">
                        <div class="brand-section d-flex flex-column justify-content-center align-items-center text-center pt-4 pb-5">
                            <img th:src="@{/img/character.png}" class="brand-character mb-3" alt="iUnoT">

                            <h1 class="fw-bold mb-2">
                                iUnoT
                            </h1>

                            <p class="text-secondary mb-0">
                                의약품 환경 · 재고 관리 시스템
                            </p>
                            <p class="text-muted small mt-2">
                                온·습도, 유통기한, 재고를 하나의 플랫폼에서 관리하세요.
                            </p>

                        </div>

                    </div>

                    <div class="col-lg-7">
                        <div class="login-section p-5">
                            <h1 class="fw-bold mb-2">비밀번호 변경</h1>
                            <p class="text-muted small mb-5">
                                새로운 비밀번호로 변경합니다.
                            </p>

                            <form th:action="@{/pwd/{token}(token=${token})}"
                                  method="post"
                                  th:object="${resetPasswordForm}">
                                <div class="mb-4">
                                    <input type="password"
                                           class="form-control form-control-lg rounded-3"
                                           th:field="*{newPassword}"
                                           th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'"
                                           placeholder="바꿀 비밀번호를 입력하세요."
                                           minlength="6"
                                           maxlength="64"
                                           autocomplete="new-password"
                                           required>
                                    <div class="invalid-feedback"
                                         th:text="${#fields.hasErrors('newPassword') ? #fields.errors('newPassword')[0] : '새 비밀번호는 6자 이상 64자 이하여야 합니다.'}">
                                        새 비밀번호는 6자 이상 64자 이하여야 합니다.
                                    </div>
                                </div>
                                <div class="mb-4">
                                    <input type="password"
                                           class="form-control form-control-lg rounded-3"
                                           th:field="*{confirmPassword}"
                                           th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                                           placeholder="다시 비밀번호를 입력하세요."
                                           minlength="6"
                                           maxlength="64"
                                           autocomplete="new-password"
                                           required>
                                    <div class="invalid-feedback"
                                         th:text="${#fields.hasErrors('confirmPassword') ? #fields.errors('confirmPassword')[0] : '새 비밀번호를 다시 입력해주세요.'}">
                                        새 비밀번호를 다시 입력해주세요.
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-dark btn-lg w-100">
                                    새로운 비밀번호 전송
                                </button>
                                <div class="text-center text-secondary mt-3">
                                    이미 계정이 있으신가요?
                                    <a href="/login" tabindex="-1" class="link-secondary">로그인</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
