<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/auth-layout}">

<head>
    <title>로그인</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<div layout:fragment="content">
    <div class="container vh-100 d-flex align-items-center justify-content-center">
        <div class="card border-0 login-card">
            <div class="card-body p-0">
                <div class="row g-0 align-items-center">
                    <div class="col-lg-5">
                        <div class="brand-section d-flex flex-column justify-content-center align-items-center text-center pt-4 pb-5">
                            <img th:src="@{/img/character.png}" class="brand-character mb-3" alt="iUnoT">

                            <h1 class="fw-bold mb-2">
                                iUnoT
                            </h1>

                            <p class="text-secondary mb-0">
                                의약품 환경 · 재고 관리 시스템
                            </p>

                            <p class="text-muted small mt-2">
                                온·습도, 유통기한, 재고를 하나의 플랫폼에서 관리하세요.
                            </p>

                        </div>

                    </div>

                    <div class="col-lg-7">
                        <div class="login-section p-5">
                            <h1 class="fw-bold mb-4">로그인</h1>
                            <form>
                                <div class="mb-4">
                                    <label class="form-label">
                                        이메일
                                    </label>
                                    <input type="email" class="form-control form-control-lg rounded-3" placeholder="이메일을 입력하세요." required>
                                </div>

                                <div class="mb-4">
                                    <div>
                                        <label class="form-label">
                                            비밀번호
                                            <span class="form-label-description">
                                                <a href="/forgot-password" class="text-secondary">비밀번호 찾기</a>
                                            </span>
                                        </label>
                                    </div>
                                    <input type="password" class="form-control form-control-lg rounded-3" placeholder="비밀번호를 입력하세요." required>
                                </div>
                                <button class="btn btn-dark btn-lg w-100">
                                    로그인
                                </button>

                                <div class="alert alert-light border mt-4 py-2 px-3">
                                    <i class="ti ti-info-circle me-2"></i>
                                    <small>
                                        회원가입은 조직 관리자가 발송한 초대 링크를 통해서만 가능합니다.
                                    </small>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
