<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/auth-layout}">

<head>
    <title>로그인</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<div layout:fragment="content">
    <div class="container vh-100 d-flex align-items-center justify-content-center">
        <div class="card border-0 login-card">
            <div class="card-body p-0">
                <div class="row g-0 align-items-center">
                    <div class="col-lg-5">
                        <div class="brand-section d-flex flex-column justify-content-center align-items-center text-center pt-4 pb-5">
                            <img th:src="@{/img/profile.png}" class="brand-character mb-3" alt="iUnoT">

                            <h1 class="fw-bold mb-2">
                                iUnoT
                            </h1>

                            <p class="text-secondary mb-0">
                                의약품 환경 · 재고 관리 시스템
                            </p>

                            <p class="text-muted small mt-2">
                                온·습도, 유통기한, 재고를 하나의 플랫폼에서 관리하세요.
                            </p>

                        </div>

                    </div>

                    <div class="col-lg-7">
                        <div class="login-section">
                            <h1 class="fw-bold mb-4">로그인</h1>
                            <form th:action="@{/login}" th:object="${loginRequest}" method="post">
                                <div class="mb-4">
                                    <label class="form-label">
                                        이메일
                                    </label>
                                    <input type="email"
                                           id="email"
                                           th:field="*{email}"
                                           class="form-control form-control-lg rounded-3"
                                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                           placeholder="test@example.com"
                                            required>

                                    <div class="invalid-feedback"
                                         th:if="${#fields.hasErrors('email')}"
                                         th:errors="*{email}">
                                        이메일을 입력해주세요.
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label">
                                        비밀번호
                                        <span class="form-label-description">
                                            <a th:href="@{/forgot-password}" class="text-secondary">비밀번호 찾기</a>
                                        </span>
                                    </label>
                                    <input type="password"
                                           id="password"
                                           name="password"
                                           class="form-control form-control-lg rounded-3"
                                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                                           placeholder="********"
                                        required>

                                    <div class="invalid-feedback"
                                         th:if="${#fields.hasErrors('password')}"
                                         th:errors="*{password}">
                                        비밀번호를 입력해주세요.
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary btn-lg w-100">
                                    로그인
                                </button>

                                <div class="alert alert-light border mt-4 py-2 px-3">
                                    <i class="ti ti-info-circle me-2"></i>
                                    <small>
                                        회원가입은 조직 관리자가 발송한 초대 링크를 통해서만 가능합니다.
                                    </small>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script th:if="${param.error != null and param.error[0] == 'invite'}">
        alert('초대 링크가 없습니다.' + '\n' +
            '조직 관리자가 발송한 초대 링크를 통해 회원가입해주세요.');
    </script>
</div>
</body>
</html>
