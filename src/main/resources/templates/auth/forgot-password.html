<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/auth-layout}">

<head>
    <title>비밀번호 찾기</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<div layout:fragment="content">
    <div class="container vh-100 d-flex align-items-center justify-content-center">
        <div class="card border-0 login-card">
            <div class="card-body p-0">
                <div class="row g-0 align-items-center">
                    <div class="col-lg-5">
                        <div class="brand-section d-flex flex-column justify-content-center align-items-center text-center pt-4 pb-5">
                            <img th:src="@{/img/character.png}" class="brand-character mb-3" alt="iUnoT">

                            <h1 class="fw-bold mb-2">
                                iUnoT
                            </h1>

                            <p class="text-secondary mb-0">
                                의약품 환경 · 재고 관리 시스템
                            </p>
                            <p class="text-muted small mt-2">
                                온·습도, 유통기한, 재고를 하나의 플랫폼에서 관리하세요.
                            </p>

                        </div>

                    </div>

                    <div class="col-lg-7">
                        <div class="login-section p-5">
                            <h1 class="fw-bold mb-2">비밀번호 재설정</h1>
                            <p class="text-muted small mb-4">
                                이메일을 입력하시면 새로운 비밀번호를 이메일로 보내드립니다.
                            </p>

                            <form>
                                <div class="mb-4">
                                    <input class="form-control form-control-lg rounded-3" placeholder="Email">
                                </div>

                                <button class="btn btn-dark btn-lg w-100">
                                    새로운 비밀번호 전송
                                </button>
                                <div class="text-center text-secondary mt-3">
                                    Already have account?
                                    <a href="/login" tabindex="-1" class="link-secondary">Sign in</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
