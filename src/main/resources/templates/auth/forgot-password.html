<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/auth-layout}">

<head>
    <title>비밀번호 찾기</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container min-vh-100 d-flex align-items-center py-5">
        <div class="row justify-content-center w-100 mx-0">
            <div class="col-12 col-xl-9">
                <div class="card border-0 shadow-lg overflow-hidden">
                    <div class="card-body p-0">
                        <div class="row g-0 align-items-stretch">
                            <div class="col-lg-5">
                                <div class="h-100 d-flex flex-column justify-content-center align-items-center text-center p-4 p-lg-5 bg-body-tertiary">
                                    <img th:src="@{/img/profile.png}" class="img-fluid w-50 mb-3" alt="iUnoT">
                                    <h1 class="fw-bold mb-2">iUnoT</h1>
                                    <p class="text-secondary mb-0">의약품 환경 · 재고 관리 시스템</p>
                                    <p class="text-muted small mt-2 mb-0">
                                        온·습도, 유통기한, 재고를 하나의 플랫폼에서 관리하세요.
                                    </p>
                                </div>
                            </div>

                            <div class="col-lg-7">
                                <div class="p-4 p-lg-5">
                                    <h1 class="fw-bold mb-2">비밀번호 찾기</h1>
                                    <p class="text-muted small mb-5">
                                        이메일을 입력하시면 비밀번호 재설정 링크를 보내드립니다.
                                    </p>

                                    <div id="password-reset-request-message"
                                         class="alert alert-success"
                                         role="alert"
                                         th:if="${successMessage}"
                                         th:text="${successMessage}"></div>

                                    <form th:action="@{/pwd}"
                                          method="post"
                                          th:object="${resetPasswordTokenRequest}">
                                        <div class="mb-4">
                                            <label class="form-label required" for="email">이메일</label>
                                            <input type="email"
                                                   id="email"
                                                   class="form-control form-control-lg"
                                                   th:field="*{email}"
                                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                                   placeholder="이메일을 입력하세요."
                                                   maxlength="254"
                                                   autocomplete="email"
                                                   required>
                                            <div class="invalid-feedback" th:errors="*{email}"></div>
                                        </div>

                                        <button type="submit" class="btn btn-primary btn-lg w-100">전송</button>
                                        <div class="text-center text-secondary mt-3">
                                            이미 계정이 있으신가요?
                                            <a th:href="@{/login}" class="link-secondary">로그인</a>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
