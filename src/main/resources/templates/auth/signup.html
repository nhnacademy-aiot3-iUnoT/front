<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/auth-layout}">

<head>
    <title>회원가입</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<div layout:fragment="content">
    <div class="container vh-100 d-flex align-items-center justify-content-center">
        <div class="row justify-content-center w-100 mx-0">
            <div class="col-12 col-xl-9">
                <div class="card border-0 login-card">
                    <div class="card-body p-0">
                        <div class="row g-0 align-items-stretch">
                            <div class="col-lg-5">
                                <div class="brand-section d-flex flex-column justify-content-center align-items-center text-center pt-4 pb-5">
                                    <img th:src="@{/img/profile.png}" class="brand-character mb-3" alt="iUnoT">
                                    <h1 class="fw-bold mb-2">iUnoT</h1>
                                    <p class="text-secondary mb-0">의약품 환경 · 재고 관리 시스템</p>
                                    <p class="text-muted small mt-2 mb-0">
                                        온·습도, 유통기한, 재고를 하나의 플랫폼에서 관리하세요.
                                    </p>
                                </div>
                            </div>

                            <div class="col-lg-7">
                                <div class="login-section">
                                    <h1 class="fw-bold mb-4">회원가입</h1>

                                    <form id="signup-form" th:action="@{/signup}" th:object="${signupRequest}" method="post">
                                        <input type="hidden" th:field="*{inviteToken}">

                                        <div class="mb-3">
                                            <label class="form-label required" for="email">이메일</label>
                                            <div class="input-group">
                                                <input type="email"
                                                       id="email"
                                                       th:field="*{email}"
                                                       class="form-control form-control-lg"
                                                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                                       placeholder="test@example.com"
                                                       maxlength="254"
                                                       autocomplete="username"
                                                       required>
                                                <button type="button"
                                                        id="emailCheck"
                                                        class="btn btn-outline-secondary">중복확인</button>
                                                <div id="email-feedback"
                                                     class="invalid-feedback"
                                                     th:text="${#fields.hasErrors('email') ? #fields.errors('email')[0] : '이메일을 입력해주세요.'}">
                                                    이메일을 입력해주세요.
                                                </div>
                                            </div>
                                        </div>

                                        <div class="mb-3">
                                            <label class="form-label required" for="pwd">비밀번호</label>

                                            <div class="position-relative">
                                                <input id="pwd"
                                                       type="password"
                                                       th:field="*{password}"
                                                       class="form-control form-control-lg pe-5"
                                                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                                                       minlength="6"
                                                       maxlength="64"
                                                       autocomplete="new-password"
                                                       placeholder="********"
                                                       required>

                                                <button type="button"
                                                        id="password-toggle"
                                                        class="btn btn-icon btn-ghost-secondary password-toggle-button position-absolute top-50 end-0 translate-middle-y me-2 z-1"
                                                        aria-label="비밀번호 보기"
                                                        aria-pressed="false"
                                                        data-bs-toggle="tooltip"
                                                        data-bs-placement="top"
                                                        data-bs-title="비밀번호 보기">
                                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                                         viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                                         class="icon icon-tabler icons-tabler-outline icon-tabler-eye"
                                                         aria-hidden="true">
                                                        <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                                                        <path d="M10 12a2 2 0 1 0 4 0a2 2 0 0 0 -4 0"/>
                                                        <path d="M21 12c-2.4 4 -5.4 6 -9 6c-3.6 0 -6.6 -2 -9 -6c2.4 -4 5.4 -6 9 -6c3.6 0 6.6 2 9 6"/>
                                                    </svg>
                                                </button>

                                                <div class="invalid-feedback"
                                                     th:text="${#fields.hasErrors('password') ? #fields.errors('password')[0] : '비밀번호는 6자 이상 64자 이하여야 합니다.'}">
                                                    비밀번호는 6자 이상 64자 이하여야 합니다.
                                                </div>
                                            </div>
                                        </div>

                                        <div class="mb-3">
                                            <label class="form-label required" for="pwd-check">비밀번호 재확인</label>

                                            <div class="position-relative">
                                                <input id="pwd-check"
                                                       type="password"
                                                       th:field="*{confirmPassword}"
                                                       class="form-control form-control-lg pe-5"
                                                       th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                                                       minlength="6"
                                                       maxlength="64"
                                                       autocomplete="new-password"
                                                       placeholder="********"
                                                       required>

                                                <button type="button"
                                                        id="confirm-password-toggle"
                                                        class="btn btn-icon btn-ghost-secondary password-toggle-button position-absolute top-50 end-0 translate-middle-y me-2 z-1"
                                                        aria-label="비밀번호 보기"
                                                        aria-pressed="false"
                                                        data-bs-toggle="tooltip"
                                                        data-bs-placement="top"
                                                        data-bs-title="비밀번호 보기">
                                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                                         viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                                         class="icon icon-tabler icons-tabler-outline icon-tabler-eye"
                                                         aria-hidden="true">
                                                        <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                                                        <path d="M10 12a2 2 0 1 0 4 0a2 2 0 0 0 -4 0"/>
                                                        <path d="M21 12c-2.4 4 -5.4 6 -9 6c-3.6 0 -6.6 -2 -9 -6c2.4 -4 5.4 -6 9 -6c3.6 0 6.6 2 9 6"/>
                                                    </svg>
                                                </button>

                                                <div class="invalid-feedback"
                                                     th:text="${#fields.hasErrors('confirmPassword') ? #fields.errors('confirmPassword')[0] : '비밀번호를 다시 입력해주세요.'}">
                                                    비밀번호를 다시 입력해주세요.
                                                </div>
                                            </div>
                                        </div>

                                        <div class="mb-3">
                                            <label class="form-label required" for="name">이름</label>
                                            <input id="name"
                                                   class="form-control form-control-lg"
                                                   th:field="*{name}"
                                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                                                   maxlength="100"
                                                   autocomplete="name"
                                                   placeholder="홍길동"
                                                   required>
                                            <div class="invalid-feedback"
                                                 th:text="${#fields.hasErrors('name') ? #fields.errors('name')[0] : '이름을 입력해주세요.'}">
                                                이름을 입력해주세요.
                                            </div>
                                        </div>

                                        <button type="submit"
                                                id="signup-submit"
                                                class="btn btn-primary btn-lg w-100"
                                                disabled>회원가입</button>

                                        <div class="text-center text-secondary mt-3">
                                            이미 계정이 있으신가요?
                                            <a th:href="@{/login}" class="link-secondary">로그인</a>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="script">
    <script th:src="@{/js/common/validation.js}"></script>
    <script th:src="@{/js/common/form.js}"></script>
    <script th:src="@{/js/auth/signup.js}"></script>
</th:block>
</body>
</html>
