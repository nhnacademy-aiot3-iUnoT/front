<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/auth-layout}">

<head>
    <title>회원가입</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<div layout:fragment="content">
    <div class="container vh-100 d-flex align-items-center justify-content-center">
        <div class="card border-0 login-card">
            <div class="card-body p-0">
                <div class="row g-0 align-items-center">
                    <div class="col-lg-5">
                        <div class="brand-section d-flex flex-column justify-content-center align-items-center text-center pt-4 pb-5">
                            <img th:src="@{/img/character.png}" class="brand-character mb-3" alt="iUnoT">

                            <h1 class="fw-bold mb-2">
                                iUnoT
                            </h1>

                            <p class="text-secondary mb-0">
                                의약품 환경 · 재고 관리 시스템
                            </p>

                            <p class="text-muted small mt-2">
                                온·습도, 유통기한, 재고를 하나의 플랫폼에서 관리하세요.
                            </p>

                        </div>
                    </div>

                    <div class="col-lg-7">
                        <div class="login-section p-5">
                            <h1 class="fw-bold mb-4">회원가입</h1>

                            <form id="signup-form" th:action="@{/signup}" th:object="${signupRequest}" method="post">

                                <input type="hidden" th:field="*{inviteToken}">

                                <div class="mb-3">
                                    <label class="form-label">
                                        이메일
                                    </label>
                                    <div class="input-group">
                                        <input type="email"
                                               id="email"
                                               th:field="*{email}"
                                               class="form-control form-control-lg rounded-3"
                                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                               required>

                                        <button type="button"
                                                id="emailCheck"
                                                class="btn btn-outline-secondary">
                                            중복확인
                                        </button>

                                        <div id="email-feedback" class="invalid-feedback">
                                            이메일 오류
                                        </div>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">
                                        비밀번호
                                    </label>
                                    <input id="pwd"
                                           type="password"
                                           th:field="*{password}"
                                           class="form-control form-control-lg rounded-3"
                                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                                           placeholder="비밀번호를 입력하세요."
                                           required>

                                    <div class="invalid-feedback"
                                         th:if="${#fields.hasErrors('password')}"
                                         th:errors="*{password}">
                                        비밀번호 오류
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">
                                        비밀번호 재확인
                                    </label>
                                    <input id="pwd-check"
                                           type="password"
                                           class="form-control form-control-lg rounded-3"
                                           placeholder="재확인 비밀번호를 입력하세요."
                                           required>
                                    <div class="invalid-feedback">
                                        비밀번호가 일치하지 않습니다.
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">
                                        이름
                                    </label>
                                    <input class="form-control form-control-lg rounded-3"
                                           th:field="*{name}"
                                           placeholder="이름을 입력하세요." required>
                                </div>

                                <!--
                                <div class="form-check mb-4">
                                    <input class="form-check-input" type="checkbox" id="agree" required>
                                    <label class="form-check-label" for="agree">
                                        <a href="/terms">이용약관</a> 및
                                        <a href="/privacy">개인정보 처리방침</a>에 동의합니다. (필수)
                                    </label>
                                </div>
                                -->

                                <button type="submit"
                                        id="signup-submit"
                                        class="btn btn-dark btn-lg w-100"
                                        disabled>
                                    회원가입
                                </button>

                                <div class="text-center text-secondary mt-3">
                                    이미 계정이 있으신가요?
                                    <a href="/login" tabindex="-1" class="link-secondary">로그인</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const pwdInput = document.getElementById("pwd");
        const pwdCheckInput = document.getElementById("pwd-check");
        const emailInput = document.getElementById("email");
        const emailCheckButton = document.getElementById("emailCheck");
        const emailFeedback = document.getElementById("email-feedback");
        const signupForm = document.getElementById("signup-form");
        const submitButton = document.getElementById("signup-submit");
        let verifiedEmail = null;
        let emailCheckPromise = null;
        let submitApproved = false;

        function checkPwdEquals() {
            const isEqual = pwdInput.value === pwdCheckInput.value;

            pwdCheckInput.classList.toggle(
                "is-invalid",
                !isEqual && pwdInput.value !== "" && pwdCheckInput.value !== ""
            );

            pwdCheckInput.setCustomValidity(
                isEqual ? "" : "비밀번호가 일치하지 않습니다."
            );

            return isEqual;
        }

        pwdInput.addEventListener("input", checkPwdEquals);
        pwdCheckInput.addEventListener("input", checkPwdEquals);


        function setEmailInvalid(message) {
            emailInput.classList.add("is-invalid");
            emailInput.classList.remove("is-valid");
            emailInput.setCustomValidity(message);
            emailFeedback.textContent = message;
            verifiedEmail = null;
            submitButton.disabled = true;
        }

        function setEmailValid(checkedEmail) {
            emailInput.classList.remove("is-invalid");
            emailInput.classList.add("is-valid");
            emailInput.setCustomValidity("");
            verifiedEmail = checkedEmail;
            submitButton.disabled = false;
        }

        async function checkEmail() {
            const checkedEmail = emailInput.value.trim();

            emailInput.setCustomValidity("");

            if (!emailInput.validity.valid) {
                const message = emailInput.validity.valueMissing
                    ? "이메일을 입력해주세요."
                    : "올바른 이메일 형식으로 입력해주세요.";

                setEmailInvalid(message);
                return false;
            }

            try {
                const response = await fetch("/check-email", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: checkedEmail
                    })
                });

                if (!response.ok) {
                    throw new Error("이메일 중복 확인 요청 실패");
                }

                const data = await response.json();

                if (emailInput.value.trim() !== checkedEmail) {
                    return false;
                }

                if (!data.available) {
                    setEmailInvalid("이미 사용 중인 이메일입니다.");
                    return false;
                }

                setEmailValid(checkedEmail);
                return true;
            } catch (error) {
                setEmailInvalid("이메일 중복 확인 중 오류가 발생했습니다.");
                return false;
            }
        }

        async function startEmailCheck() {
            if (emailCheckPromise) {
                return emailCheckPromise;
            }

            verifiedEmail = null;
            submitButton.disabled = true;
            emailCheckButton.disabled = true;

            const promise = checkEmail();
            emailCheckPromise = promise;

            try {
                return await promise;
            } finally {
                if (emailCheckPromise === promise) {
                    emailCheckPromise = null;
                }
                emailCheckButton.disabled = false;
            }
        }

        emailCheckButton.addEventListener("click", startEmailCheck);

        emailInput.addEventListener("input", () => {
            verifiedEmail = null;
            submitButton.disabled = true;
            emailInput.classList.remove("is-valid", "is-invalid");
            emailInput.setCustomValidity("");
        });

        signupForm.addEventListener("submit", async event => {
            if (submitApproved) {
                return;
            }

            event.preventDefault();

            const submitter = event.submitter;
            submitButton.disabled = true;

            try {
                if (emailCheckPromise) {
                    await emailCheckPromise;
                }

                if (verifiedEmail !== emailInput.value.trim()) {
                    setEmailInvalid("이메일 중복확인이 필요합니다.");
                    emailInput.reportValidity();
                    return;
                }

                checkPwdEquals();

                if (!signupForm.reportValidity()) {
                    return;
                }

                submitApproved = true;
                submitButton.disabled = false;

                if (submitter) {
                    signupForm.requestSubmit(submitter);
                } else {
                    signupForm.requestSubmit();
                }
            } finally {
                if (!submitApproved && verifiedEmail === emailInput.value.trim()) {
                    submitButton.disabled = false;
                }
            }
        });
    </script>
</div>

</body>
</html>
