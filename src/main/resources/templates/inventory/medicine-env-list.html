<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>medicine-env-list</title>
</head>
<body>
    <main class="environment-page">
        <header class="page-header">

            <div>
                <p class="eyebrow">의약품 기준 관리</p>
                <h1>의약품 환경기준</h1>
                <p>의약품을 검색한 뒤 온도·습도·조도 허용 범위를 조회하고 관리합니다.</p>
            </div>


        </header>

    <section class="panel search-panel" aria-labelledby="search-title">
        <div class="section-heading">
            <div><span class="step">01</span><div><h2 id="search-title">의약품 선택</h2><p>제품명 또는 품목기준코드로 검색하세요.</p></div></div>
        </div>


        <form method="get" th:action="@{/pack-units/environment-standards}">

            <div class="search-type">
                <label>
                    <input type="radio" name="searchType" value="PRODUCT_NAME" checked>
                    제품명 검색
                </label>

                <label>
                    <input type="radio" name="searchType" value="ITEM_CODE">
                    품목기준코드 검색
                </label>

            </div>

            <div class="search-input-group">
                <label for="medicine-search" class="visually-hidden">
                    의약품 검색어
                </label>
                <input type="search"  id="medicine-search" name="search" placeholder="제품명을 입력하세요." required>
                <button type="submit">검색</button>
            </div>


        </form>


        <section class="medicine-result-section" th:if="${medicines != null}">

            <div class="section-heading">
                <h2>검색 결과</h2>
                <span th:text="|총 ${medicines.totalElements} 건|"></span>
            </div>

            <p class="empty-result" th:if="${#lists.isEmpty(medicines.content)}">
                검색 결과가 없습니다.
            </p>

            <table th:if="${! #lists.isEmpty(medicines.content)}">
                <thead>
                <tr>
                    <th>품목기준코드</th>
                    <th>제품명</th>
                    <th>업체명</th>
                    <th>포장단위</th>

                </tr>

                </thead>

                <tbody>
                <tr th:each="item : ${medicines}" class="medicine-row" tabindex="0" role="link"
                    th:data-url="@{/pack-units/{packUnitId}/environment-standards(packUnitId=${item.packageUnitId})}">
                    <td th:text="${item.itemCode}"></td>
                    <td th:text="${item.productName}"></td>
                    <td th:text="${item.companyName}"></td>
                    <td th:text="${item.packUnit}"></td>
                </tr>
                </tbody>

            </table>


            <div class="pagination" th:if="${medicines != null and medicines.totalPages > 1}">

                <a th:if="${currentPage >0}"
                   th:href="@{/medicines(searchType=${medicineSearchRequest.searchType},
                   search=${medicineSearchRequest.search},
                   page=${currentPage - 1},
                   size=${pageSize}
                   )}">
                    이전
                </a>

                <a th:each="pageNum : ${#numbers.sequence(0, totalPages - 1)}"
                   th:href="@{/medicines(searchType=${medicineSearchRequest.searchType},
                   search=${medicineSearchRequest.search},
                   page=${pageNum},
                   size=${pageSize}
                   )}"
                   th:text="${pageNum + 1}"
                   th:classappend="${pageNum == currentPage} ? ' active'">
                </a>

                <a th:if="${currentPage + 1 < totalPages}"
                   th:href="@{/medicines(
                    searchType=${medicineSearchRequest.searchType},
                    search=${medicineSearchRequest.search},
                    page=${currentPage + 1},
                    size=${pageSize}
                    )}">
                    다음
                </a>

            </div>

        </section>


    </section>

    <section class="pannel criteria-panel" th:if="${!#lists.isEmpty(medicineTypes)}" aria-labelledby="criteria-title">
        <div class="section-heading criteria-heading">
            <div>
                <span class="step">02</span>
                <div>
                    <h2 id="criteria-title">환경기준 설정</h2>
                    <p>선택한 의약품의 허용 범위입니다.</p>
                    <span class="mode-badge" th:text="${#lists.isEmpty(medicineTypes)} ? '신규 등록' : '등록됨'">등록됨</span>
                </div>
            </div>
        </div>

        <article class="medicine-summary">
            <div class="medicine-icon" aria-hidden="true">✚</div>
            <div>
                <span>선택한 의약품</span>
                <h3 th:text="${medicine.productName}">제품명</h3>
                <span th:text="${medicine.companyName}">업체명</span>
                <span th:text="${medicine.itemCode}">품목기준코드</span>
                <span th:text="${medicine.packUnit}">단위</span>
            </div>

        </article>







    </section>


</main>

</body>
</html>
