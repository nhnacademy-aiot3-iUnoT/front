<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">

<head>
    <title>전체 재고 | iUnoT</title>
    <link rel="stylesheet" th:href="@{/css/inventory-design.css}">
</head>
<body>


<div layout:fragment="content">
    <main class="inventory-page">
        <div class="page-heading">


            <p class="breadcrumb">
                <span class="breadcrumb-parent">재고 관리</span>
                <span class="breadcrumb-separator">/</span>
                <span class="breadcrumb-current" th:text="${isBoss ? '전체 재고' : '소속 부서 재고'}">전체 재고</span>
            </p>

            <p class="description"
               th:text="${isBoss ? '조직 전체에 등록된 의약품 재고와 보관 위치를 확인합니다.'
               : '소속 부서에 등록된 의약품 재고와 보관 위치를 확인합니다.'}">
                의약품 재고와 보관 위치를 확인합니다.
            </p>


            <div class="department-scope" th:if="${!isBoss and departmentNames != null and !departmentNames.isEmpty()}">
                <span class="scope-label">조회 부서</span>
                <span class="department-chip" th:each="department : ${departmentNames}" th:text="${department}">약제부</span>
            </div>



            <div class="header-actions">
                <a th:href="@{/inventories/under-reviews}" class="secondary-action-button">
                    ⚠️ 환경 검토 대상 재고
                </a>
                <a th:href="@{/inventory}" class="primary-button">＋ 의약품 입고 등록</a>
            </div>
        </div>
        <div class="alert alert-success"
             th:if="${successMessage}"
             th:text="${successMessage}">
        </div>
        <section class="inventory-card">
            <form class="toolbar" method="get" th:action="@{/inventories}">

                <label class="search-box">
                    <span>⌕</span>
                    <input id="inventory-search" name="search" type="search" placeholder="의약품명 검색">
                </label>
                <div class="filters">
                    <!-- dropdown -->
                    <select name="storage-id" class="storage-select">

                        <option value="">
                            저장소 목록
                        </option>
                        <option th:each="item : ${storages}" th:value="${item.storageId}" th:text="${item.storageName}">
                        </option>

                    </select>

                    <button type="submit" class="search-button">
                        검색
                    </button>

                </div>
            </form>


            <div class="table-wrap">
                <table th:if="${inventories != null and !#lists.isEmpty(inventories)}">
                    <thead>
                    <tr>
                        <th>의약품</th>
                        <th>품목기준코드</th>
                        <th>유통기한</th>
                        <th>보관 위치</th>
                        <th>현재 수량</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${inventories}" class="inventory-row" th:data-storage-id="${item.storageId}" th:data-pack-unit-id="${item.packUnitId}">
                        <td class="medicine">
                            <strong th:text="${item.productName}">
                                의약품명
                            </strong>

                            <small th:text="${item.packUnit}">
                                포장단위
                            </small>
                        </td>


                        <td th:text="${item.itemCode}"></td>
                        <td th:text="${item.expirationDate}"></td>
                        <td th:text="${item.storageName}"></td>
                        <td th:text="${item.totalQuantity}"></td>
                    </tr>
                    </tbody>
                </table>

                <p class="empty-message" th:if="${inventories == null or #lists.isEmpty(inventories)}">
                    조회된 재고가 없습니다.
                </p>

            </div>


            <div class="pagination" th:if="${totalPages != null and totalPages > 1}">

                <a class="page-button" th:if="${startPage > 0}" th:href="@{/inventories(search=${search},storage-id=${selectedStorageId},page=${startPage - 1},size=${pageSize})}">이전</a>

                <a class="page-button" th:each="pageNum : ${#numbers.sequence(startPage,endPage)}" th:href="@{/inventories(search=${search},storage-id=${selectedStorageId},page=${startPage - 1},size=${pageSize})}"
                    th:text="${pageNum + 1}" th:classappend="${pageNum == currentPage} ? ' active'" th:attr="aria-current=${pageNum == currentPage} ? 'page'">
                </a>

                <a class="page-button" th:if="${endPage + 1 < totalPages}" th:href="@{/inventories(search=${search},storage-id=${selectedStorageId},page=${startPage - 1},size=${pageSize})}">다음</a>
            </div>



        </section>
    </main>
</div>
<th:block layout:fragment="script">
    <script>
        const successAlert =
            document.querySelector(".inventory-page .alert-success");

        if (successAlert) {
            setTimeout(() => {
                successAlert.remove();
            }, 3000);
        }
        document.querySelectorAll('tbody tr').forEach(row => {

            // 추후 경로 수정 필요
            row.addEventListener('click', () => {
                const storageId = row.dataset.storageId;
                const packUnitId = row.dataset.packUnitId;
                location.href = `/storages/${storageId}/pack-units/${packUnitId}`;

            });
        });
    </script>
</th:block>

</body>
</html>
