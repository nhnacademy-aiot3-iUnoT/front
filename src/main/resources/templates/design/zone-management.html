<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">
<head>
    <title>구역 관리 | iUnoT</title>
    <link rel="stylesheet" th:href="@{/css/management-design.css}">
</head>
<body>
<div layout:fragment="content">
    <main class="container-xl management-page">
        <div class="management-header">
            <div>
                <p class="text-muted small mb-2">저장소 관리 <span class="mx-1">/</span> 구역 관리</p>
                <h1>구역 관리</h1>
                <p>저장소별 보관 구역과 환경 상태를 관리합니다.</p>
            </div>
        </div>

        <div class="management-grid">
            <section class="management-card">
                <div class="management-card-header">
                    <h2>구역 목록 <span class="text-muted small ms-2">3개</span></h2>
                </div>
                <div class="table-responsive">
                    <table class="management-table">
                        <thead>
                        <tr>
                            <th>구역명</th>
                            <th>저장소</th>
                            <th>운영 상태</th>
                            <th>환경 상태</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr>
                            <td data-label="구역명"><strong>A-03 상온 보관구역</strong></td>
                            <td data-label="저장소">본원 의약품 저장소</td>
                            <td data-label="운영 상태"><span class="management-status">ACTIVE</span></td>
                            <td data-label="환경 상태"><span class="management-status">NORMAL</span></td>
                            <td data-label="관리"><button class="btn btn-sm btn-outline-secondary">수정</button> <button class="btn btn-sm btn-outline-warning">상태 변경</button> <button class="btn btn-sm btn-outline-danger">삭제</button></td>
                        </tr>
                        <tr>
                            <td data-label="구역명"><strong>B-01 냉장 보관구역</strong></td>
                            <td data-label="저장소">본원 의약품 저장소</td>
                            <td data-label="운영 상태"><span class="management-status">ACTIVE</span></td>
                            <td data-label="환경 상태"><span class="management-status">NORMAL</span></td>
                            <td data-label="관리"><button class="btn btn-sm btn-outline-secondary">수정</button> <button class="btn btn-sm btn-outline-warning">환경 변경</button> <button class="btn btn-sm btn-outline-danger">삭제</button></td>
                        </tr>
                        <tr>
                            <td data-label="구역명"><strong>진료실 비치함</strong></td>
                            <td data-label="저장소">외래 진료부 저장소</td>
                            <td data-label="운영 상태"><span class="management-status inactive">INACTIVE</span></td>
                            <td data-label="환경 상태"><span class="management-status warning">WARNING</span></td>
                            <td data-label="관리"><button class="btn btn-sm btn-outline-secondary">수정</button> <button class="btn btn-sm btn-outline-warning">상태 변경</button> <button class="btn btn-sm btn-outline-danger">삭제</button></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <section class="management-card">
                <div class="management-card-header">
                    <h2>구역 등록</h2>
                </div>
                <form>
                    <div class="management-card-body">
                        <div class="mb-3">
                            <label class="form-label" for="zone-storage">저장소</label>
                            <select id="zone-storage" class="form-select">
                                <option>본원 의약품 저장소</option>
                                <option>외래 진료부 저장소</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="zone-name">구역명</label>
                            <input id="zone-name" class="form-control" maxlength="30" placeholder="구역명을 입력하세요">
                        </div>
                        <div>
                            <label class="form-label" for="zone-description">설명</label>
                            <textarea id="zone-description" class="form-control" rows="4" maxlength="255" placeholder="구역 설명을 입력하세요"></textarea>
                        </div>
                    </div>
                    <div class="management-card-footer text-end">
                        <button type="button" class="btn btn-primary">등록</button>
                    </div>
                </form>
            </section>
        </div>
    </main>
</div>
</body>
</html>
