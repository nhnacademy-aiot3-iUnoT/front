<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">

<head>
    <meta charset="UTF-8">
    <title>비밀번호 변경</title>
</head>
<body>
<div layout:fragment="content">
    <div class="py-6">
        <div class="page-header d-print-none mb-4">
            <div class="row align-items-center">
                <div class="col">
                    <h1 class="page-title">비밀번호 변경</h1>
                    <div class="text-muted mt-1">계정의 비밀번호를 안전하게 변경하세요.</div>
                </div>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8 col-xl-7">
                <form id="change-password-form"
                      class="card"
                      th:action="@{/mypage/change-password}"
                      th:method="put"
                      th:object="${changePasswordForm}">
                    <div class="card-header">
                        <div>
                            <h2 class="card-title mb-1">비밀번호 변경</h2>
                            <p class="text-secondary mb-0">
                                현재 비밀번호를 확인한 후 새로운 비밀번호를 설정해주세요.
                            </p>
                        </div>
                    </div>

                    <div class="card-body">
                        <div class="mb-4">
                            <label class="form-label required" for="current-password">기존 비밀번호</label>
                            <input type="password"
                                   id="current-password"
                                   class="form-control"
                                   th:field="*{currentPassword}"
                                   th:classappend="${#fields.hasErrors('currentPassword')} ? ' is-invalid'"
                                   minlength="6"
                                   maxlength="64"
                                   autocomplete="current-password"
                                   required>
                            <div class="invalid-feedback"
                                 th:text="${#fields.hasErrors('currentPassword') ? #fields.errors('currentPassword')[0] : '기존 비밀번호를 입력해주세요.'}">
                                기존 비밀번호를 입력해주세요.
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label required" for="new-password">새로운 비밀번호</label>
                            <input type="password"
                                   id="new-password"
                                   class="form-control"
                                   th:field="*{newPassword}"
                                   th:classappend="${#fields.hasErrors('newPassword')} ? ' is-invalid'"
                                   minlength="6"
                                   maxlength="64"
                                   autocomplete="new-password"
                                   required>
                            <div id="new-password-feedback"
                                 class="invalid-feedback"
                                 th:text="${#fields.hasErrors('newPassword') ? #fields.errors('newPassword')[0] : '새 비밀번호는 6자 이상 64자 이하여야 합니다.'}">
                                새 비밀번호는 6자 이상 64자 이하여야 합니다.
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label required" for="confirm-password">비밀번호 확인</label>
                            <input type="password"
                                   id="confirm-password"
                                   class="form-control"
                                   th:field="*{confirmPassword}"
                                   th:classappend="${#fields.hasErrors('confirmPassword')} ? ' is-invalid'"
                                   minlength="6"
                                   maxlength="64"
                                   autocomplete="new-password"
                                   required>
                            <div id="confirm-password-feedback"
                                 class="invalid-feedback"
                                 th:text="${#fields.hasErrors('confirmPassword') ? #fields.errors('confirmPassword')[0] : '새 비밀번호를 다시 입력해주세요.'}">
                                새 비밀번호를 다시 입력해주세요.
                            </div>
                        </div>
                    </div>

                    <div class="card-footer d-flex justify-content-end gap-2">
                        <a th:href="@{/mypage}" class="btn btn-outline-secondary">취소</a>
                        <button type="submit" class="btn btn-primary">비밀번호 변경</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="script">
    <script th:src="@{/js/common/validation.js}"></script>
    <script th:src="@{/js/common/form.js}"></script>
    <script th:src="@{/js/account/change.js}"></script>
</th:block>
</body>
</html>
