<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/auth-layout}">

<head>
    <title>계정 재활성화</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body>
<div layout:fragment="content">
    <div class="container vh-100 d-flex align-items-center justify-content-center">
        <div class="card border-0 login-card">
            <div class="card-body p-0">
                <div class="row g-0 align-items-center">
                    <div class="col-lg-5">
                        <div class="brand-section d-flex flex-column justify-content-center align-items-center text-center pt-4 pb-5">
                            <img th:src="@{/img/profile.png}" class="brand-character mb-3" alt="iUnoT">
                            <h1 class="fw-bold mb-2">iUnoT</h1>
                            <p class="text-secondary mb-0">의약품 환경 · 재고 관리 시스템</p>
                        </div>
                    </div>

                    <div class="col-lg-7">
                        <div class="login-section text-center">
                            <span class="avatar avatar-xl rounded-circle bg-yellow-lt mb-4">
                                <i class="ti ti-user-pause fs-1"></i>
                            </span>
                            <h1 class="fw-bold mb-3">비활성화된 계정입니다</h1>
                            <p class="text-secondary mb-4"
                               th:if="${#strings.isEmpty(reactivationConfirmRequest.token)}">
                                가입한 이메일로 인증 링크를 받은 뒤 계정을 재활성화해주세요.
                            </p>

                            <p class="text-secondary mb-4"
                               th:unless="${#strings.isEmpty(reactivationConfirmRequest.token)}">
                                이메일 인증 링크를 확인했습니다. 아래 버튼을 눌러 계정을 재활성화해주세요.
                            </p>

                            <div id="reactivation-success-message"
                                 class="alert alert-success text-start"
                                 role="alert"
                                 th:if="${successMessage}"
                                 th:text="${successMessage}"></div>

                            <div id="reactivation-error-message"
                                 class="alert alert-danger text-start"
                                 role="alert"
                                 th:if="${errorMessage}"
                                 th:text="${errorMessage}"></div>

                            <form id="reactivation-verification-form"
                                  th:action="@{/reactivation/verification}"
                                  method="post"
                                  th:if="${#strings.isEmpty(reactivationConfirmRequest.token)}">
                                <button type="submit" class="btn btn-primary btn-lg w-100">
                                    인증 메일 보내기
                                </button>
                            </form>

                            <form id="reactivation-confirm-form"
                                  th:action="@{/reactivation/confirm}"
                                  method="post"
                                  th:object="${reactivationConfirmRequest}"
                                  th:unless="${#strings.isEmpty(reactivationConfirmRequest.token)}">
                                <input type="hidden" th:field="*{token}">

                                <div id="reactivation-token-error"
                                     class="alert alert-danger text-start"
                                     role="alert"
                                     th:if="${#fields.hasErrors('token')}"
                                     th:errors="*{token}"></div>

                                <button type="submit" class="btn btn-primary btn-lg w-100">
                                    계정 재활성화 확인
                                </button>
                            </form>

                            <form id="reactivation-resend-form"
                                  th:action="@{/reactivation/verification}"
                                  method="post"
                                  class="mt-3"
                                  th:unless="${#strings.isEmpty(reactivationConfirmRequest.token)}">
                                <button type="submit" class="btn btn-outline-primary w-100">
                                    인증 메일 다시 받기
                                </button>
                            </form>

                            <form th:action="@{/logout}" method="post" class="mt-3">
                                <button type="submit" class="btn btn-ghost-secondary w-100">
                                    로그아웃
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
