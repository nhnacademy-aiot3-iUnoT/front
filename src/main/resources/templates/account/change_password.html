<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">

<head>
    <meta charset="UTF-8">
    <title>비밀번호 변경</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row">
        <div class="col-lg-8 col-xl-7 mx-auto">
            <div class="card">
                <div class="card-header">
                    <div>
                        <h3 class="card-title">비밀번호 변경</h3>
                    </div>
                </div>

                <form th:action="@{/}" method="post">
                    <div class="list-group list-group-flush">
                        <div class="list-group-item">
                            <label class="text-secondary mb-2">기존 비밀번호</label>
                            <input type="password" class="form-control" name="password" required>
                        </div>

                        <div class="list-group-item">
                            <label class="text-secondary mb-2">새로운 비밀번호</label>
                            <input type="password" class="form-control" required>
                        </div>

                        <div class="list-group-item">
                            <label class="text-secondary mb-2">비밀번호 확인</label>
                            <input type="password" class="form-control" required>
                        </div>
                    </div>

                    <div class="card-footer text-end">
                        <a th:href="@{/mypage}" class="btn btn-outline-secondary">취소</a>
                        <button type="submit" class="btn btn-dark">비밀번호 변경</button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
</body>
</html>
