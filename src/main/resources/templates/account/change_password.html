<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">

<head>
    <meta charset="UTF-8">
    <title>비밀번호 변경</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row">
        <div class="col-lg-8 col-xl-7 mx-auto">
            <div class="card">
                <div class="card-header">
                    <div>
                        <h3 class="card-title">비밀번호 변경</h3>
                    </div>
                </div>

                <form id="change-password-form"
                      th:action="@{/mypage/change-password}"
                      th:method="put"
                      th:object="${changePasswordForm}"
                      novalidate>
                    <div class="list-group list-group-flush">
                        <div class="list-group-item">
                            <label class="text-secondary mb-2">기존 비밀번호</label>
                            <input type="password"
                                   id="current-password"
                                   class="form-control"
                                   th:field="*{currentPassword}"
                                   th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'"
                                   minlength="6"
                                   maxlength="64"
                                   autocomplete="current-password"
                                   required>
                            <div class="invalid-feedback"
                                 th:text="${#fields.hasErrors('currentPassword') ? #fields.errors('currentPassword')[0] : '기존 비밀번호를 입력해주세요.'}">
                                기존 비밀번호를 입력해주세요.
                            </div>
                        </div>

                        <div class="list-group-item">
                            <label class="text-secondary mb-2">새로운 비밀번호</label>
                            <input type="password"
                                   id="new-password"
                                   class="form-control"
                                   th:field="*{newPassword}"
                                   th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'"
                                   minlength="6"
                                   maxlength="64"
                                   autocomplete="new-password"
                                   required>
                            <div id="new-password-feedback"
                                 class="invalid-feedback"
                                 th:text="${#fields.hasErrors('newPassword') ? #fields.errors('newPassword')[0] : '새 비밀번호는 6자 이상 64자 이하여야 합니다.'}">
                                새 비밀번호는 6자 이상 64자 이하여야 합니다.
                            </div>
                        </div>

                        <div class="list-group-item">
                            <label class="text-secondary mb-2">비밀번호 확인</label>
                            <input type="password"
                                   id="confirm-password"
                                   class="form-control"
                                   th:field="*{confirmPassword}"
                                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                                   minlength="6"
                                   maxlength="64"
                                   autocomplete="new-password"
                                   required>
                            <div id="confirm-password-feedback"
                                 class="invalid-feedback"
                                 th:text="${#fields.hasErrors('confirmPassword') ? #fields.errors('confirmPassword')[0] : '새 비밀번호를 다시 입력해주세요.'}">
                                새 비밀번호를 다시 입력해주세요.
                            </div>
                        </div>
                    </div>

                    <div class="card-footer text-end">
                        <a th:href="@{/mypage}" class="btn btn-outline-secondary">취소</a>
                        <button type="submit" class="btn btn-dark">비밀번호 변경</button>
                    </div>
                </form>

            </div>
        </div>
    </div>
    <script th:src="@{/js/change.js}"></script>
</div>
</body>
</html>
