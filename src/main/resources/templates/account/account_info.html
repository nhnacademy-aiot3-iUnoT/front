<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">

<head>
    <meta charset="UTF-8">
    <title>회원정보</title>
</head>

<body>

<div layout:fragment="content">
    <div class="row">
        <div class="col-lg-8 col-xl-7 mx-auto">
            <div class="card">
                <div class="card-header">
                    <div>
                        <h3 class="card-title">회원정보</h3>
                        <p class="card-subtitle">계정 정보를 확인합니다.</p>
                    </div>
                </div>

                <form th:action="@{/mypage}" th:method="put">
                    <div class="list-group list-group-flush">
                        <div class="list-group-item">
                            <div class="text-secondary">이메일</div>
                            <div class="fw-semibold" th:text="${accountInfoResponse.email}"></div>
                        </div>

                        <div class="list-group-item">
                            <label class="text-secondary mb-2">이름</label>
                            <input type="text" class="form-control" name="name"
                                   th:value="${accountInfoResponse.name}">
                        </div>

                        <div class="list-group-item">
                            <div class="text-secondary">가입일</div>
                            <div class="fw-semibold"
                                 th:text="${#temporals.format(accountInfoResponse.createdAt, 'yyyy-MM-dd')}"></div>
                        </div>
                    </div>

                    <div class="card-footer text-end">
                        <button type="submit" class="btn btn-dark">저장</button>
                        <a th:href="@{/mypage/change-password}" class="btn btn-outline-secondary ms-2">비밀번호 변경</a>
                        <a th:href="@{/withdraw}" class="btn btn-outline-danger ms-2">회원탈퇴</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div id="success-message" th:if="${successMessage}"
         th:data-message="${successMessage}" hidden></div>
    <script>
        const successMessage = document.getElementById("success-message");

        if (successMessage) {
            alert(successMessage.dataset.message);
        }
    </script>
</div>
</body>
</html>
