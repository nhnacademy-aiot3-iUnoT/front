<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">

<head>
    <meta charset="UTF-8">
    <title>초대 관리</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/status.css}">
</head>

<body>
<div layout:fragment="content">
    <div class="page">
        <div class="page-wrapper">
            <div class="container-xl">

                <div class="page-header mt-3">
                    <div class="row align-items-center">
                        <div class="col">
                            <h2 class="page-title">초대 관리</h2>
                            <div class="text-secondary">
                                조직원 초대를 조회하고 관리합니다.
                            </div>
                        </div>

                        <div class="col-auto">
                            <form th:action="@{/organizations/me/invitations}"
                                  th:object="${invitationCreateRequest}"
                                  method="post"
                                  class="d-flex gap-2">

                                <div>
                                    <input type="email"
                                           th:field="*{email}"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                           placeholder="초대할 이메일">

                                    <div class="invalid-feedback"
                                         th:if="${#fields.hasErrors('email')}"
                                         th:errors="*{email}">
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-primary">
                                    조직원 초대
                                </button>
                            </form>
                        </div>

                        <div class="col-auto">
                            <a th:href="@{/organizations/me}"
                               class="btn btn-outline-secondary">
                                조직 정보
                            </a>
                        </div>
                    </div>
                </div>

                <div class="card mt-4">
                    <div class="card-body">
                        <form th:action="@{/organizations/me/invitations}"
                              method="get"
                              class="row g-2">

                            <div class="col-md-5">
                                <input type="text"
                                       name="email"
                                       class="form-control"
                                       placeholder="이메일 검색"
                                       th:value="${param.email}">
                            </div>

                            <div class="col-md-4">
                                <select name="status" class="form-select">
                                    <option value="">전체 상태</option>
                                    <option th:each="status : ${invitationStatuses}"
                                            th:value="${status}"
                                            th:text="${status}"
                                            th:selected="${param.status != null and param.status[0] == status.name}">
                                    </option>
                                </select>
                            </div>

                            <div class="col-md-3">
                                <button type="submit"
                                        class="btn btn-primary w-100">
                                    검색
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card mt-3">
                    <div class="table-responsive">
                        <table class="table table-vcenter card-table">
                            <thead>
                            <tr>
                                <th>이메일</th>
                                <th>상태</th>
                                <th>초대일</th>
                                <th>만료일</th>
                                <th></th>
                            </tr>
                            </thead>

                            <tbody>
                            <tr th:if="${#lists.isEmpty(invitations.content)}">
                                <td colspan="5"
                                    class="text-center text-secondary py-4">
                                    초대 내역이 없습니다.
                                </td>
                            </tr>

                            <tr th:each="invitation : ${invitations.content}">
                                <td th:text="${invitation.email}"></td>
                                <td>
                                    <span class="badge status-badge"
                                          th:classappend="' status-' + ${invitation.status.name().toLowerCase()}"
                                          th:text="${invitation.status.ko}">
                                    </span>
                                </td>
                                <td th:text="${#temporals.format(invitation.createdAt, 'yyyy-MM-dd HH:mm' )}"></td>
                                <td th:text="${#temporals.format(invitation.expiredAt,  'yyyy-MM-dd HH:mm')}"></td>
                                <td class="text-end">
                                    <div class="d-flex justify-content-end gap-2">

                                        <form th:if="${invitation.status.name() == 'ACTIVE'}"
                                              th:action="@{/organizations/me/invitations/{id}/resend(id=${invitation.id})}"
                                              method="post">
                                            <button type="submit" class="btn btn-sm btn-outline-primary">
                                                재전송
                                            </button>
                                        </form>

                                        <form th:if="${invitation.status.name() == 'ACTIVE' or invitation.status.name() == 'CANCELED'}"
                                              th:action="@{/organizations/me/invitations/{id}/reissue(id=${invitation.id})}"
                                              method="post">
                                            <button type="submit" class="btn btn-sm btn-primary">
                                                재발급
                                            </button>
                                        </form>

                                        <form th:if="${invitation.status.name() == 'ACTIVE'}"
                                              th:action="@{/organizations/me/invitations/{id}/cancel(id=${invitation.id})}"
                                              method="post">
                                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                                취소
                                            </button>
                                        </form>

                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="card-footer py-3"
                         th:if="${invitations.totalPages > 0}">
                        <ul class="pagination m-0 justify-content-center">
                            <li class="page-item"
                                th:classappend="${invitations.page == 0} ? 'disabled'">
                                <a class="page-link"
                                   th:href="@{/organizations/me/invitations(
                                       page=${invitations.page - 1},
                                       size=${invitations.size},
                                       email=${param.email},
                                       status=${param.status}
                                   )}">
                                    이전
                                </a>
                            </li>

                            <li class="page-item"
                                th:each="pageNumber : ${#numbers.sequence(0, invitations.totalPages - 1)}"
                                th:classappend="${pageNumber == invitations.page} ? 'active'">
                                <a class="page-link"
                                   th:text="${pageNumber + 1}"
                                   th:href="@{/organizations/me/invitations(
                                       page=${pageNumber},
                                       size=${invitations.size},
                                       email=${param.email},
                                       status=${param.status}
                                   )}">
                                </a>
                            </li>

                            <li class="page-item"
                                th:classappend="${invitations.last} ? 'disabled'">
                                <a class="page-link"
                                   th:href="@{/organizations/me/invitations(
                                       page=${invitations.page + 1},
                                       size=${invitations.size},
                                       email=${param.email},
                                       status=${param.status}
                                   )}">
                                    다음
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
</body>
</html>
