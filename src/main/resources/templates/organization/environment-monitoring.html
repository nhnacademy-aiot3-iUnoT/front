<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">
<head>
    <meta charset="UTF-8">
    <title>환경 관리</title>
    <link rel="stylesheet" th:href="@{/css/environment-monitoring.css}">
</head>
<body>

<div layout:fragment="content">
    <div class="env-page">

        <div class="env-page-header">
            <h2>
                <span class="env-org-prefix"
                      th:if="${organizationName != null}"
                      th:text="${organizationName + ' > '}"></span>
                🌡️ 환경 관리
            </h2>
            <p class="env-page-desc">구역을 선택하면 해당 구역의 센서 상세 정보를 볼 수 있습니다.</p>
        </div>

        <!-- 저장소가 하나도 없을 때 -->
        <div class="env-empty" th:if="${#lists.isEmpty(storageZones)}">
            등록된 저장소가 없습니다.
        </div>

        <!-- 저장소별 카드 -->
        <div class="env-storage-card" th:each="storage : ${storageZones}">

            <div class="env-storage-header">
                <h3 class="env-storage-name">
                    📦 <span th:text="${storage.storageName}">저장소 이름</span>
                </h3>
                <span class="env-badge"
                      th:classappend="${storage.storageStatus.name() == 'ACTIVE'} ? 'active' : 'inactive'"
                      th:text="${storage.storageStatus.ko}">활성화</span>
            </div>

            <!-- 구역이 없는 저장소 -->
            <p class="env-empty-zones" th:if="${#lists.isEmpty(storage.zones)}">
                등록된 구역이 없습니다.
            </p>

            <!-- 구역 목록 -->
            <div class="env-zone-grid" th:unless="${#lists.isEmpty(storage.zones)}">
                <div class="env-zone-item" th:each="zone : ${storage.zones}">

                    <div class="env-zone-top">
                        <span class="env-zone-name" th:text="${zone.name}">구역 이름</span>
                        <span class="env-badge"
                              th:classappend="${zone.status.name() == 'ACTIVE'} ? 'active' : 'inactive'"
                              th:text="${zone.status.ko}">활성화</span>
                    </div>

                    <div class="env-zone-bottom">
                        <span class="env-zone-label">환경 상태</span>
                        <span class="env-badge"
                              th:classappend="${zone.envStatus.name() == 'NORMAL'}
                                              ? 'env-normal'
                                              : (${zone.envStatus.name() == 'WARNING'} ? 'env-warning' : 'env-danger')"
                              th:text="${zone.envStatus.ko}">정상</span>
                    </div>

                    <a class="env-zone-go"
                       th:href="@{/storages/{storageId}/zones/{zoneId}/sensorInfo(storageId=${storage.storageId}, zoneId=${zone.zoneId})}">
                        센서 상세 보기 →
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
