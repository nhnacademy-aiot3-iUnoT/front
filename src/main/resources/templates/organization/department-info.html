<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">
<head>
    <meta charset="UTF-8">
    <title>부서 정보</title>
</head>
<body>
<div layout:fragment="content">
    <div class="py-6">
        <div class="page-header d-print-none mb-4">
            <div class="row align-items-center">
                <div class="col">
                    <h2 class="page-title" th:text="${department.name}"></h2>
                    <div class="text-muted">부서의 저장소, 소속 조직원을 관리합니다.</div>
                </div>
                <div class="col-auto">
                    <a class="btn btn-outline-secondary" th:href="@{/departments}">부서 목록</a>
                </div>
            </div>
        </div>

        <div class="row row-cards">
            <div class="card">
                <form id="departmentUpdateForm" th:action="@{/departments/{id}(id=${department.id})}" th:object="${departmentUpdateRequest}" th:method="put">
                    <div class="card-header"><h3 class="card-title">기본 정보</h3></div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="name" class="form-label required">부서명</label>
                            <input id="name" class="form-control" th:field="*{name}" maxlength="30" required th:readonly="${memberRole.name == 'ORG_MEMBER'}">
                            <div class="invalid-feedback"></div>
                            <div class="text-danger" th:errors="*{name}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">소개</label>
                            <textarea id="description" class="form-control" th:field="*{description}" maxlength="255" rows="5" th:readonly="${memberRole.name == 'ORG_MEMBER'}"></textarea>
                            <div class="invalid-feedback"></div>
                            <div class="text-danger" th:errors="*{description}"></div>
                        </div>
                        <div th:if="${memberRole.name != 'ORG_MEMBER'}" class="d-flex justify-content-between mt-2">
                            <div class="form-hint"></div>
                            <small class="text-muted">
                                최대 255자
                            </small>
                        </div>
                        <div class="row"><div class="col-sm-3 text-muted">생성일</div><div class="col-sm-9" th:text="${#temporals.format(department.createdAt, 'yyyy-MM-dd HH:mm')}"></div></div>
                    </div>
                </form>
                <div th:if="${memberRole.name != 'ORG_MEMBER'}" class="card-footer bg-transparent d-flex justify-content-end align-items-center gap-2">
                    <button class="btn btn-primary" type="submit" form="departmentUpdateForm">저장</button>
                    <form th:action="@{/departments/{id}(id=${department.id})}" th:method="delete"
                          onsubmit="return confirm('부서를 삭제하시겠습니까? 연결된 부서 정보도 함께 삭제됩니다.');">
                        <button class="btn btn-danger" type="submit">부서 삭제</button>
                    </form>
                </div>
            </div>
        </div>
        <div th:if="${message}" class="alert alert-success mt-2" th:text="${message}"></div>

        <div class="row row-cards mt-2" th:if="${memberRole.name != 'ORG_MEMBER'}">
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">담당 저장소</h3>
                    </div>
                    <div class="card-body">
                        <input class="form-control mb-2" id="storage-search" placeholder="저장소 검색">
                        <div id="storage-search-results" class="list-group mb-3"></div>
                        <div th:each="storage : ${departmentStorages}" class="d-flex justify-content-between align-items-center border-bottom py-2"
                             th:data-assigned-storage-id="${storage.storageId}">
                            <a th:href="@{/storages/{id}(id=${storage.storageId})}"
                               th:text="${storage.name}"></a>
                            <button type="button" class="btn btn-sm btn-outline-danger"
                                    data-storage-remove
                                    th:data-storage-id="${storage.storageId}">삭제</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="mt-3 col-lg-6">
                <div class="card">
                    <div class="card-header"><h3 class="card-title">소속 조직원</h3></div>
                    <div class="card-body">
                        <input class="form-control mb-2" id="member-search" placeholder="이메일 검색">
                        <div id="member-search-results" class="list-group mb-3"></div>
                        <div th:each="member : ${departmentMembers}"
                             class="d-flex justify-content-between align-items-center border-bottom py-2">
                            <span th:text="${member.email}"></span>
                            <button type="button" class="btn btn-sm btn-outline-danger"
                                    data-member-remove
                                    th:data-member-id="${member.memberId}">삭제</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
<th:block layout:fragment="script">
    <script th:src="@{/js/common/validation.js}"></script>
    <script th:src="@{/js/common/form.js}"></script>
    <script th:src="@{/js/common/field-validator.js}"></script>
    <script th:inline="javascript">
        window.departmentId = /*[[${department.id}]]*/ 0;
        window.assignedMemberIds = /*[[${departmentMembers.![memberId]}]]*/ [];
    </script>
    <script th:src="@{/js/organization/department/department-info.js}"></script>
</th:block>
</html>
