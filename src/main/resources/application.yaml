spring:
  application:
    name: team1-front
  mvc:
    hiddenmethod:
      filter:
        enabled: true

server:
  port: ${SERVER_PORT:10404}

management:
  endpoints:
    web:
      exposure:
        include: health, serviceregistry
  endpoint:
    health:
      show-details: never

gateway:
  url: http://localhost:10400

security:
  jwt:
    issuer: ${JWT_ISSUER:account-api}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:30m}
    allowed-algorithms:
      - rs256
    jwk-set-uri: ${JWK_SET_URI:http://localhost:10413/.well-known/jwks.json}