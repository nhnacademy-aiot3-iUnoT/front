spring:
  application:
    name: team1-front

server:
  port: ${SERVER_PORT:10404}

eureka:
  instance:
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: >-
        http://team1-eureka-1:10402/eureka/,
        http://team1-eureka-2:10403/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never