spring:
  application:
    name: team1-front
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  config:
    import: optional:file:.env[.properties]

server:
  port: ${SERVER_PORT:10404}

management:
  endpoints:
    web:
      exposure:
        include: health, service-registry
  endpoint:
    health:
      show-details: never

gateway:
  url: http://localhost:10400

juso:
  confirm-key: ${JUSO_CONFIRM_KEY}
